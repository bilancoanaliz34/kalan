<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F8F7; --yzy:#FFFFFF; --ink:#13201C; --mut:#6A7A74; --cizgi:#DDE4E1;
  --cizgi2:#EDF1EF; --marka:#1E5B4B; --marka2:#4F8575; --acik:#DDEEE7;
  --sari:#E3A31B; --sariZ:#FDF4E0; --sariY:#8A6208;
  --kirmizi:#C74A32; --kirmiziZ:#FBE9E7; --kirmiziY:#9A3B26;
  --yesil:#1E7A4E; --golge:0 1px 2px rgba(19,32,28,.06);
}
html[data-tema="koyu"]{
  --bg:#0F1614; --yzy:#161F1C; --ink:#E8EFEC; --mut:#93A39D; --cizgi:#25302C;
  --cizgi2:#1E2825; --marka:#5FC79E; --marka2:#3E8A6C; --acik:#1B2F28;
  --sariZ:#2E2411; --sariY:#E8B64A; --kirmiziZ:#33201C; --kirmiziY:#F08A70;
  --yesil:#5FC79E; --golge:none;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Onest',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--marka)}

/* ---------- düzen ---------- */
.uyg{display:flex;min-height:100vh}
.yan{width:232px;flex-shrink:0;background:var(--yzy);border-right:1px solid var(--cizgi);
  padding:20px 14px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 20px}
.logo .m{width:34px;height:34px;border-radius:10px;background:var(--marka);
  display:flex;align-items:center;justify-content:center}
.logo .m svg{width:22px;height:22px}
.logo b{font-size:19px;font-weight:600;letter-spacing:-.6px}
.yan a.sek{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:11px;
  font-size:14px;color:var(--mut);text-decoration:none;font-weight:500}
.yan a.sek:hover{background:var(--cizgi2);color:var(--ink)}
.yan a.sek.on{background:var(--acik);color:var(--marka);font-weight:600}
.yan a.sek svg{width:19px;height:19px}
.yan .bosluk{flex:1}
.durum{font-size:11.5px;color:var(--mut);padding:8px 11px;display:flex;align-items:center;gap:7px}
.durum i{width:7px;height:7px;border-radius:50%;background:var(--mut);flex-shrink:0}
.durum.ok i{background:var(--yesil)} .durum.hata i{background:var(--kirmizi)}
.ana{flex:1;min-width:0;padding:26px 32px 80px;width:100%}
.ust{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.ust h1{font-size:23px;font-weight:600;letter-spacing:-.6px;flex:1}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- parçalar ---------- */
.kart{background:var(--yzy);border:1px solid var(--cizgi);border-radius:18px;padding:18px 20px;box-shadow:var(--golge)}
.izgara{display:grid;gap:16px}
.i2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.i3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.bas{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.bas > span:first-of-type{flex:1}
.etk{font-size:12.5px;color:var(--mut)}
.buyuk{font-size:34px;font-weight:700;letter-spacing:-1.2px}
.orta{font-size:22px;font-weight:600;letter-spacing:-.6px}
.rozet{display:inline-block;font-size:12px;font-weight:500;background:var(--acik);color:var(--marka);padding:3px 9px;border-radius:20px}
.rozet.s{background:var(--sariZ);color:var(--sariY)}
.uyari{background:var(--sariZ);color:var(--sariY);border-radius:10px;
  padding:10px 12px;font-size:13px;line-height:1.5}
.rozet.k{background:var(--kirmiziZ);color:var(--kirmiziY)}
.rozet.n{background:var(--cizgi2);color:var(--mut)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:12px;
  background:var(--ink);color:var(--bg);font-size:13.5px;font-weight:500}
.btn.ikincil{background:var(--cizgi2);color:var(--ink)}
.btn.ince{padding:6px 11px;font-size:12.5px;border-radius:10px}
.btn.tehlike{background:var(--kirmiziZ);color:var(--kirmiziY)}
.btn svg{width:16px;height:16px}
.btn:disabled{opacity:.5;cursor:default}
.alan{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.alan label{font-size:12.5px;color:var(--mut)}
.alan input,.alan select,.alan textarea{padding:9px 11px;border:1px solid var(--cizgi);
  border-radius:11px;background:var(--yzy);width:100%}
.alan input:focus,.alan select:focus,.alan textarea:focus{outline:2px solid var(--marka2);outline-offset:-1px}
.satir{display:grid;gap:10px;grid-template-columns:1fr 1fr}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:12px;color:var(--mut);font-weight:500;padding:7px 8px;border-bottom:1px solid var(--cizgi)}
td{padding:9px 8px;border-bottom:1px solid var(--cizgi2);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.sag,th.sag{text-align:right}
.sayi{font-variant-numeric:tabular-nums}
.bkaydir{overflow-x:auto;padding-bottom:4px}
.butceIzgara{display:grid;grid-template-columns:190px repeat(3, minmax(210px, 1fr));
  gap:10px;min-width:840px;align-items:stretch}
.bay{background:var(--yzy);border:1px solid var(--cizgi);border-radius:18px;padding:14px 16px;box-shadow:var(--golge)}
.bay.simdi{border-color:var(--marka2)}
.baybas{display:flex;align-items:center;gap:8px;font-size:15px}
.baybas b{font-weight:600;flex:1}
.bbaslik{font-size:12px;color:var(--mut);padding:14px 4px 2px;font-weight:500}
.bkat{display:flex;align-items:center;font-size:14px;font-weight:500;padding:10px 4px;
  border-top:1px solid var(--cizgi2)}
.bhucre{border-top:1px solid var(--cizgi2);padding:10px 10px 8px;border-radius:0 0 8px 8px;cursor:pointer}
.bhucre:hover{background:var(--cizgi2)}
.bsatir{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;margin-bottom:6px}
.bsatir b{font-weight:600}
.bdevir{font-size:11.5px;color:var(--mut);margin-top:5px;min-height:14px}
.bkat.btoplam,.bhucre.btoplam{border-top:2px solid var(--cizgi);font-weight:600;cursor:default}
.bhucre.btoplam:hover{background:transparent}
.iz{height:8px;border-radius:5px;background:var(--cizgi2);overflow:hidden}
.iz i{display:block;height:8px;border-radius:5px;background:var(--marka)}
.iz i.s{background:var(--sari)} .iz i.k{background:var(--kirmizi)}
.bos{padding:26px 10px;text-align:center;color:var(--mut);font-size:13.5px}
.sek2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.sek2 button{font-size:13px;padding:7px 13px;border-radius:18px;background:var(--cizgi2);color:var(--mut)}
.sek2 button.on{background:var(--ink);color:var(--bg);font-weight:500}
.arakutu{display:inline-flex;align-items:center;gap:6px;background:var(--cizgi2);
  border-radius:18px;padding:0 10px;height:30px}
.arakutu svg{width:15px;height:15px;flex:none;opacity:.55}
.arakutu svg .ic{fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.arakutu input{border:0;background:none;outline:none;font:inherit;font-size:13px;
  color:var(--ink);width:140px;padding:0}
.arakutu input::placeholder{color:var(--mut)}
.arakutu input::-webkit-search-cancel-button{display:none}
.arakutu button{background:none;padding:0 2px;font-size:17px;line-height:1;
  color:var(--mut);border-radius:0}
.arakutu button:hover{color:var(--ink)}
.arabos{padding:18px;text-align:center;color:var(--mut);font-size:14px}
.arasag{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
@media(max-width:720px){
  .arasag{margin-left:0;width:100%;margin-top:4px}
  .arakutu{flex:1}
  .arakutu input{width:100%;min-width:0}
  .arazaman{flex-basis:100%}
}
.liste .oge{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--cizgi2)}
.liste .oge:last-child{border-bottom:0}
.liste .oge .t{flex:1;min-width:0}
.liste .oge .t b{font-weight:500;font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.liste .oge .t small{color:var(--mut);font-size:12.5px}
.liste .oge .a{font-weight:600;font-size:14px;white-space:nowrap}
.gun{width:44px;height:44px;border-radius:13px;border:1px solid var(--cizgi);display:flex;
  flex-direction:column;align-items:center;justify-content:center;font-weight:600;font-size:15px;line-height:1;flex-shrink:0}
.gun small{font-size:9.5px;color:var(--mut);font-weight:500;margin-top:2px}
.gun.yakin{border-color:var(--sari);background:var(--sariZ)}
.gun.gecmis{border-color:var(--kirmizi);background:var(--kirmiziZ)}
.gun.odendi{background:var(--cizgi2);border-color:var(--cizgi2);color:var(--mut)}
.art{color:var(--yesil)} .eks{color:var(--kirmiziY)}
.asgari{font-size:11.5px;font-weight:500;color:var(--kirmizi);text-align:right;margin-top:2px}

/* ---------- kaplama ---------- */
.kapla{position:fixed;inset:0;background:rgba(10,18,16,.45);display:flex;align-items:center;
  justify-content:center;padding:20px;z-index:50}
.kapla .kutu{background:var(--yzy);border-radius:20px;padding:22px;width:100%;max-width:460px;
  max-height:90vh;overflow:auto}
.kapla .kutu.genis{max-width:720px}
.kutu h3{font-size:17px;font-weight:600;margin-bottom:16px}
.dugmeler{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}
.gizli{display:none!important}
.hicon{width:38px;height:38px;border-radius:12px;background:var(--acik);color:var(--marka);
  display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;flex-shrink:0}
th.siralanir{cursor:pointer;user-select:none;white-space:nowrap}
th.siralanir:hover{color:var(--ink)}
th.siralanir.aktif{color:var(--marka);font-weight:600}
th.siralanir i{font-style:normal;margin-left:3px;font-size:11px}
.sinyal{background:var(--yzy);border:1px solid var(--cizgi);border-left:4px solid var(--marka);
  border-radius:0 14px 14px 0;padding:14px 18px;margin-bottom:10px;box-shadow:var(--golge)}
.sinyal.satis{border-left-color:var(--kirmizi)}

/* Emirler: solda alış, sağda satış */
.ikili{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media(max-width:900px){.ikili{grid-template-columns:1fr;gap:10px}}
.emirk{background:var(--yzy);border:1px solid var(--cizgi);border-radius:14px;
  padding:12px 14px;margin-bottom:10px;box-shadow:var(--golge)}
.emirk.tetik{background:var(--acik);border-color:var(--marka2)}
.emirk.satis.tetik{background:var(--kirmiziZ);border-color:var(--kirmizi)}
.emirb{display:flex;align-items:center;gap:8px;margin-bottom:9px;min-width:0}
.emirb b{font-size:15.5px;font-weight:600;flex:none}
.emircubuk{height:6px;border-radius:4px;background:var(--cizgi2);overflow:hidden;margin-bottom:10px}
.emirk.tetik .emircubuk{background:var(--cizgi)}
.emircubuk i{display:block;height:100%;border-radius:4px;background:var(--marka2)}
.emirk.satis .emircubuk i{background:var(--kirmizi)}
.emirsat{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--mut);
  font-variant-numeric:tabular-nums;flex-wrap:wrap}
.emirsat b{color:var(--ink);font-weight:600}
.emirsin{display:flex;justify-content:space-between;gap:10px;margin-top:10px;padding-top:9px;
  border-top:1px solid var(--cizgi);font-size:13px}
.emirsin b{font-weight:600}
.sirasec{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.sirasec button{font-size:12px;padding:4px 10px;border-radius:14px;
  background:var(--cizgi2);color:var(--mut)}
.sirasec button:hover{color:var(--ink)}
.sirasec button.on{background:var(--acik);color:var(--marka);font-weight:500}
.sbas{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.sbas b{font-size:16px;font-weight:600}
.sgovde{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.acilir{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-top:14px;
  padding:10px 12px;border-radius:12px;background:var(--cizgi2);font-size:14px;color:var(--ink)}
.acilir:hover{background:var(--acik)}
.acilir b{font-weight:500}
.acilir .ok{transition:transform .15s;flex-shrink:0;color:var(--mut)}
.acilir .ok.acik{transform:rotate(90deg)}
.etiketler{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 4px}
.eticip{font-size:12.5px;padding:5px 11px;border-radius:16px;background:var(--cizgi2);color:var(--mut)}
.eticip.secili{background:var(--acik);color:var(--marka);font-weight:500}
.serit{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--sariZ);
  color:var(--sariY);border:1px solid var(--sari);border-radius:14px;padding:11px 14px;margin-bottom:18px}
.serit span{flex:1;font-size:13.5px;min-width:180px}
.serit .btn{background:var(--ink);color:var(--bg)}
.bildirim{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);
  color:var(--bg);padding:11px 18px;border-radius:13px;font-size:13.5px;z-index:80;box-shadow:0 6px 20px rgba(0,0,0,.18)}
@media(max-width:820px){
  .uyg{flex-direction:column}
  .yan{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:10px;gap:4px}
  .logo{display:none} .yan .bosluk,.yan .durum{display:none}
  .yan #girisDugmesi{display:none!important}
  .yan a.sek{flex-direction:column;font-size:10.5px;gap:3px;padding:7px 10px}
  .ana{padding:18px 16px 60px}
  .satir{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="uyg">
  <nav class="yan">
    <div class="logo">
      <div class="m"><svg viewBox="0 0 82 82"><defs><clipPath id="kl"><circle cx="41" cy="41" r="27"/></clipPath></defs>
        <circle cx="41" cy="41" r="30" fill="none" stroke="#F5F8F7" stroke-width="4.5" opacity=".4"/>
        <path d="M8 45 C18 37 25 53 35.5 45.5 C44 39.4 50 40 56 45 C62 50 68 47 74 42 L74 78 L8 78 Z" fill="#F5F8F7" clip-path="url(#kl)"/></svg></div>

    <a class="sek" data-git="hesaplar" href="#hesaplar"><svg><use href="#s-bank"/></svg>Hesaplar</a>
    <a class="sek" data-git="butce" href="#butce"><svg><use href="#s-pie"/></svg>Bütçe</a>
    <a class="sek" data-git="borclar" href="#borclar"><svg><use href="#s-doc"/></svg>Krediler</a>

    <a class="sek" data-git="kisiler" href="#kisiler"><svg><use href="#s-user"/></svg>Borç-alacak</a>
    <a class="sek" data-git="yatirim" href="#yatirim"><svg><use href="#s-chart"/></svg>Yatırımlar</a>
    <a class="sek" data-git="emirler" href="#emirler"><svg><use href="#s-bell"/></svg>Emirler</a>

    <button class="btn" id="girisDugmesi" data-eylem="sbGirisAc"
      style="display:none;margin:0 6px 8px;justify-content:center">Giriş yap</button>
    <div class="durum" id="durum"><i></i><span>Bağlanmadı</span></div>
  </nav>
  <main class="ana" id="ana"></main>
</div>

<svg width="0" height="0" style="position:absolute">

  <symbol id="s-plus" viewBox="0 0 24 24"><path class="ic" d="M12 5v14M5 12h14" style="stroke-width:2.2"/></symbol>
  <symbol id="s-sync" viewBox="0 0 24 24"><path class="ic" d="M20 11a8 8 0 0 0-14-4M4 13a8 8 0 0 0 14 4"/><path class="ic" d="M4 5v5h5M20 19v-5h-5"/></symbol>
  <symbol id="s-ara" viewBox="0 0 24 24"><circle class="ic" cx="11" cy="11" r="6.5"/><path class="ic" d="M16 16l4.5 4.5"/></symbol>
</svg>
<script>
/* ===================================================================
   KALAN — tek dosya web uygulaması
   Veri Google Sheets'te, Apps Script uç noktası üzerinden okunur/yazılır.
   Yerel kopya localStorage'da tutulur; bağlantı yoksa uygulama
   son kopyayla çalışmaya devam eder.
   =================================================================== */

/* Buraya Apps Script dağıtımından aldığın /exec adresini yapıştırırsan
   uygulama hangi bilgisayarda açılırsa açılsın kendiliğinden bağlanır. */
/* ---------------------------------------------------------------

async function sbIstek(yol, secenekler = {}, yetkili = true){
  if(!AYAR.sbUrl || !AYAR.sbKey)
    throw new Error('Supabase proje adresi ve anahtarı girilmemiş. Ayarlar ekranından ekle.');
  if(!/^https?:\/\//.test(AYAR.sbUrl))
    throw new Error('Proje adresi https:// ile başlamalı: ' + AYAR.sbUrl);
  const c = await fetch(AYAR.sbUrl.replace(/\/$/, '') + yol, Object.assign({
    headers: Object.assign(sbBasliklar(yetkili), secenekler.headers || {})
  }, secenekler, {headers: Object.assign(sbBasliklar(yetkili), secenekler.headers || {})}));
  const metin = await c.text();
  let j = null;
  try{ j = metin ? JSON.parse(metin) : null; }catch(e){ j = null; }
  if(!c.ok){
    let mesaj = (j && (j.error_description || j.msg || j.message || j.error)) || ('HTTP ' + c.status);
    const kodu = (j && (j.error_code || j.code)) || '';
    if(kodu === 'email_not_confirmed' || /not confirmed/i.test(mesaj))
      mesaj = 'Hesap e-postası doğrulanmamış. Supabase panelinde Authentication > Email bölümünde "Confirm email" ayarını kapat ya da gelen doğrulama postasındaki bağlantıya tıkla.';
    if(/Invalid login credentials/i.test(mesaj))
      mesaj = 'E-posta ya da parola hatalı.';
    if(kodu === 'user_already_exists' || /already registered/i.test(mesaj))
      mesaj = 'Bu e-posta ile zaten bir hesap var. Giriş yap ya da parolamı unuttum bağlantısını kullan.';
    if(/over_email_send_rate|rate limit/i.test(mesaj))
      mesaj = 'Çok sık denendi, bir dakika bekleyip tekrar dene.';
    if(c.status === 405) mesaj = 'Adres yanlış görünüyor (405). Ayarlar\'daki proje adresi https://xxxx.supabase.co biçiminde olmalı.';
    if(c.status === 404) mesaj = 'Adres bulunamadı (404). Proje adresini ve kalan_veri tablosunun oluştuğunu kontrol et.';
    const h = new Error(mesaj); h.kod = c.status; throw h;
  }
  return j;
}

/* ---------- Google E-Tablo'dan doğrudan okuma (Apps Script gerekmez) ----------
   Tablonun "bağlantıya sahip herkes görüntüleyebilir" olması yeterlidir.      */

function tabloKimlik(metin){
  const m = String(metin||'').match(/\/d\/([a-zA-Z0-9-_]{20,})/);
  return m ? m[1] : String(metin||'').trim();
}
function gvizIstek(sayfa){
  return new Promise((coz, red) => {
    const cb = 'kalanG' + Math.random().toString(36).slice(2,9);
    const sc = document.createElement('script');
    const temizle = () => { try{ delete window[cb]; }catch(e){ window[cb] = undefined; } sc.remove(); };
    const zaman = setTimeout(() => { temizle(); red(new Error('Zaman aşımı: ' + sayfa)); }, 25000);
    window[cb] = y => { clearTimeout(zaman); temizle(); coz(y); };
    sc.onerror = () => { clearTimeout(zaman); temizle(); red(new Error('Sayfa okunamadı: ' + sayfa)); };
    sc.src = 'https://docs.google.com/spreadsheets/d/' + AYAR.tablo +
      '/gviz/tq?headers=1&sheet=' + encodeURIComponent(sayfa) +
      '&tqx=' + encodeURIComponent('out:json;responseHandler:' + cb);
    document.head.appendChild(sc);
  });
}
function gvizTarih(v){
  const m = String(v).match(/^Date\((\d+),(\d+),(\d+)/);
  if(!m) return v;
  return m[1] + '-' + String(+m[2]+1).padStart(2,'0') + '-' + String(+m[3]).padStart(2,'0');
}
function gvizSatirlar(yanit){
  if(!yanit || !yanit.table) return [];
  const t = yanit.table;
  const basliklar = (t.cols||[]).map((c,i) => (c.label || c.id || ('k'+i)).trim());
  return (t.rows||[]).map(r => {
    const o = {};
    basliklar.forEach((b, i) => {
      const h = (r.c||[])[i];
      let v = h ? (h.v === null || h.v === undefined ? '' : h.v) : '';
      if(v instanceof Date) v = ymd(v);
      else if(typeof v === 'string' && v.indexOf('Date(') === 0) v = gvizTarih(v);
      o[b] = v;
    });
    return o;
  }).filter(o => Object.values(o).some(v => v !== '' && v !== null));
}

let dosyaKolu = null;          // FileSystemFileHandle
let dosyaHazir = false;        // izin alındı ve okundu

const dosyaDestegi = typeof window.showSaveFilePicker === 'function';

function idbAc(){
  return new Promise((coz, red) => {
    const q = indexedDB.open('kalan', 1);
    q.onupgradeneeded = () => q.result.createObjectStore('kol');
    q.onsuccess = () => coz(q.result);
    q.onerror = () => red(q.error);
  });
}
async function kolSakla(kol){
  try{ const db = await idbAc();
    await new Promise((c,r)=>{ const t = db.transaction('kol','readwrite');
      t.objectStore('kol').put(kol,'veri'); t.oncomplete=c; t.onerror=()=>r(t.error); });
  }catch(e){ console.warn('Dosya kolu saklanamadı', e); }
}
async function kolOku(){
  try{ const db = await idbAc();
    return await new Promise((c,r)=>{ const t = db.transaction('kol','readonly');
      const q = t.objectStore('kol').get('veri'); q.onsuccess=()=>c(q.result||null); q.onerror=()=>r(q.error); });
  }catch(e){ return null; }
}
async function izinAl(kol, iste){
  const se = {mode:'readwrite'};
  if(await kol.queryPermission(se) === 'granted') return true;
  if(!iste) return false;
  return await kol.requestPermission(se) === 'granted';
}
async function dosyayaYaz(){
  if(!dosyaKolu || !dosyaHazir) return false;

  await yazici.write(JSON.stringify({surum:1, ayar:{tema:AYAR.tema}, veri:D}, null, 2));

async function dosyadanOku(){
  const d = await dosyaKolu.getFile();

/* Uygulama Apps Script tarafından sunuluyorsa doğrudan sunucu
   fonksiyonları çağrılır; bu yolda CORS engeli yoktur. */
const SUNUCU_ICI = typeof google !== 'undefined' && google.script && google.script.run;

function sunucuCagir(islev, arg){
  return new Promise((coz, red) => {
    const k = google.script.run
      .withSuccessHandler(v => { try{ coz(v ? JSON.parse(v) : null); }catch(e){ coz(v); } })
      .withFailureHandler(h => red(new Error(h && h.message ? h.message : String(h))));
    arg === undefined ? k[islev]() : k[islev](arg);
  });
}

async function sheetsIstek(govde){
  if(SUNUCU_ICI){
    if(govde.action === 'load')   return {ok:true, veri: await sunucuCagir('apiLoad')};
    if(govde.action === 'saveAll'){ await sunucuCagir('apiSave', JSON.stringify(govde.data)); return {ok:true}; }
    if(govde.action === 'setup')  { await sunucuCagir('apiSetup'); return {ok:true}; }
    if(govde.action === 'prices') return {ok:true, veri: await sunucuCagir('apiPrices')};
    throw new Error('Bilinmeyen istek');
  }
  if(!AYAR.url) throw new Error('Bağlantı adresi tanımlı değil');
  const c = await fetch(AYAR.url, {
    method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(govde), redirect:'follow'
  });
  const j = await c.json();
  if(!j.ok){
    const e = new Error(j.hata || 'Bilinmeyen hata');
    e.sunucu = true;      // tabloya ulaşıldı ama işlem başarısız
    throw e;
  }
  return j;
}
/* CORS engeline takılmayan okuma yolu: betik etiketi (JSONP) */
function jsonpIstek(parametreler){
  return new Promise((coz, red) => {
    const ad = 'kalanCb' + Math.random().toString(36).slice(2,9);
    const sc = document.createElement('script');
    const temizle = () => { try{ delete window[ad]; }catch(e){ window[ad] = undefined; } sc.remove(); };
    const zaman = setTimeout(() => { temizle(); red(new Error('Zaman aşımı')); }, 25000);
    window[ad] = v => { clearTimeout(zaman); temizle(); coz(v); };
    sc.onerror = () => { clearTimeout(zaman); temizle(); red(new Error('Adrese ulaşılamadı')); };
    const q = new URLSearchParams(Object.assign({}, parametreler, {callback: ad}));
    sc.src = AYAR.url + (AYAR.url.indexOf('?') > -1 ? '&' : '?') + q.toString();
    document.head.appendChild(sc);
  });
}

function duzelt(s){
  const o = {...s};
  ['odendi','arsiv','teslimEdildi','netVarligaDahil','otomatikIsle','aktif'].forEach(k=>{

    o.etiketler = o.etiketler ? o.etiketler.split(',').map(x=>x.trim()).filter(Boolean) : [];
  return o;
}
/* Elle girilen satırlarda kimlik yerine ad yazılabilsin diye
   bağları çözer ve boş id'leri tamamlar. */
function baglariCoz(){
  const nrm = v => String(v||'').trim().toLocaleLowerCase('tr');
  TABLOLAR.forEach(t => (D[t]||[]).forEach(r => { if(r && !r.id) r.id = uid(); }));

  const hesapHar = new Map(), katHar = new Map(), borcHar = new Map(), kisiHar = new Map();
  (D.hesaplar||[]).forEach(h => hesapHar.set(nrm(h.ad), h.id));

  // önce kategorilerin üst bağı çözülür ki "Ana › Alt" yazımı kurulabilsin
  const katAd = new Map();
  (D.kategoriler||[]).forEach(k => katAd.set(nrm(k.ad), k.id));
  const katKimlik = new Set((D.kategoriler||[]).map(k => k.id));
  (D.kategoriler||[]).forEach(k => {
    if(k.parentId && !katKimlik.has(k.parentId))
      k.parentId = katAd.get(nrm(k.parentId)) || k.parentId;
  });

  (D.kategoriler||[]).forEach(k => {
    katHar.set(nrm(k.ad), k.id);
    if(k.parentId){
      const u = (D.kategoriler||[]).find(x => x.id === k.parentId);
      if(u){ katHar.set(nrm(u.ad + ' › ' + k.ad), k.id); katHar.set(nrm(u.ad + ' > ' + k.ad), k.id); }
    }
  });
  (D.borclar||[]).forEach(b => borcHar.set(nrm(b.ad), b.id));
  (D.kisiler||[]).forEach(k => kisiHar.set(nrm(k.ad), k.id));

  const hId = new Set((D.hesaplar||[]).map(h=>h.id));
  const kId = new Set((D.kategoriler||[]).map(k=>k.id));
  const bId = new Set((D.borclar||[]).map(b=>b.id));
  const pId = new Set((D.kisiler||[]).map(k=>k.id));

  // Listede olmayan kategori adı yazılmışsa kategoriyi oluştur
  const katOlustur = (metin, yon) => {
    const parcalar = String(metin).split(/[›>]/).map(x => x.trim()).filter(Boolean);
    let ustId = '';
    let sonId = '';
    parcalar.forEach((ad, ix) => {
      const anahtar = ix === 0 ? nrm(ad) : nrm(parcalar.slice(0, ix+1).join(' › '));
      let bulunan = katHar.get(anahtar) || (ix === 0 ? katAd.get(nrm(ad)) : null);
      if(!bulunan){
        bulunan = uid();
        const yeniKat = {id:bulunan, parentId:ustId, ad, yon: yon||'gider', arsiv:false, otomatik:true};
        (D.kategoriler = D.kategoriler||[]).push(yeniKat);
        katAd.set(nrm(ad), bulunan);
        katHar.set(anahtar, bulunan);
        if(ustId){
          const ust = D.kategoriler.find(x => x.id === ustId);
          if(ust) katHar.set(nrm(ust.ad + ' › ' + ad), bulunan);
        }
        kId.add(bulunan);
      }
      ustId = bulunan; sonId = bulunan;
    });
    return sonId;
  };
  const kategoriCoz = (deger, yon) => {
    if(!deger) return deger;
    if(kId.has(deger)) return deger;
    return katHar.get(nrm(deger)) || katOlustur(deger, yon);
  };

  const coz = (deger, har, kimlikler) => {
    if(!deger) return deger;
    if(kimlikler.has(deger)) return deger;         // zaten kimlik
    return har.get(nrm(deger)) || deger;
  };

  // Temettüler artık net tutarla tutuluyor: eski brüt+stopaj kayıtlarını çevir
  (D.trades||[]).forEach(t => {
    if(t.yon === 'temettu' && say(t.stopaj) > 0){
      t.fiyat = say(t.fiyat) - say(t.stopaj);
      t.stopaj = '';
    }
  });

  (D.islemler||[]).forEach(i => {
    i.hesapId = coz(i.hesapId, hesapHar, hId);
    i.hedefHesapId = coz(i.hedefHesapId, hesapHar, hId);
    i.kategoriId = kategoriCoz(i.kategoriId, i.tur === 'gelir' ? 'gelir' : 'gider');
    if(!i.tryTutar) i.tryTutar = say(i.tutar) * (say(i.kur) || 1);
    if(!i.butceYansimasi) i.butceYansimasi = say(i.taksitSayisi) > 1 ? 'taksitli' : 'tam_ay';
  });
  (D.butce||[]).forEach(b => b.kategoriId = kategoriCoz(b.kategoriId, 'gider'));
  (D.borcTaksitleri||[]).forEach(t => t.borcId = coz(t.borcId, borcHar, bId));
  (D.ekstreler||[]).forEach(e => e.hesapId = coz(e.hesapId, hesapHar, hId));
  (D.kisiBorclari||[]).forEach(k => k.kisiId = coz(k.kisiId, kisiHar, pId));
  (D.tekrarlayanlar||[]).forEach(r => {
    r.hesapId = coz(r.hesapId, hesapHar, hId);
    r.kategoriId = kategoriCoz(r.kategoriId, r.tur === 'gelir' ? 'gelir' : 'gider');
  });
}

/* ===================================================================
   FİYAT SERVİSİ
   BIST ve döviz GOOGLEFINANCE (yaklaşık 15 dk gecikmeli),
   fonlar TEFAS (günlük) üzerinden Apps Script ara katmanıyla gelir.
   İstek betik etiketiyle yapılır, bu yüzden CORS engeline takılmaz.
   =================================================================== */

function fiyatServisi(){
  return AYAR.sbUrl ? AYAR.sbUrl.replace(/\/$/, '') + '/functions/v1/fiyat' : '';
}

async function fiyatIstek(parametreler){
  const adres = fiyatServisi();
  if(!adres) throw new Error('Supabase bağlantısı yok. Ayarlar ekranından bağlan.');
  const temiz = {...parametreler}; delete temiz.__sure;
  const q = new URLSearchParams(temiz);
  const tam = adres + '?' + q.toString();
  const sure = say(parametreler.__sure) || 70000;

  const getir = async (secenekler, kendiSure) => {
    const iptal = new AbortController();
    const sayac = setTimeout(() => iptal.abort(), kendiSure || sure);
    let c;
    try{ c = await fetch(tam, {...(secenekler||{}), signal: iptal.signal}); }
    catch(e){
      const asim = e.name === 'AbortError';
      const h = new Error(asim ? 'Zaman aşımı' : e.message);
      h.agHatasi = true; h.zamanAsimi = asim; throw h;
    }
    finally{ clearTimeout(sayac); }
    return fiyatYanit(c);
  };

  // 1) Oturum başlıklarıyla dene (Verify JWT açıkken gereken yol)
  let agHatasi = null;
  if(await oturumGecerli()){
    try{
      return await getir({headers: {'apikey': AYAR.sbKey,
        'Authorization': 'Bearer ' + OTURUM.access_token}});
    }catch(e){
      if(!e.agHatasi) throw e;      // sunucu yanıt verdi ama hata döndü
      // Zaman aşımı bir yetki sorunu değil; başlıksız denemeyi tekrarlamanın
      // anlamı yok, süreyi ikiye katlamış oluruz.
      if(e.zamanAsimi) throw e;
      agHatasi = e;
    }
  }
  // 2) Başlıksız sade istek (Verify JWT kapalıysa ön kontrol hiç gerekmez)
  try{
    return await getir();
  }catch(e){
    if(e.agHatasi && agHatasi) throw new Error(
      'Servise ulaşılamadı. Supabase > Edge Functions > fiyat ayarlarında "Verify JWT" kapalı olmalı, ' +
      'ya da fonksiyon henüz yayınlanmamış olabilir.');
    throw e;
  }
}

async function fiyatYanit(c){
  let metin = '';
  try{ metin = await c.text(); }
  catch(e){ const h = new Error('Yanıt okunamadı'); h.agHatasi = true; throw h; }
  let j = null;
  try{ j = metin ? JSON.parse(metin) : null; }catch(e){}
  if(!c.ok){
    if(c.status === 404)
      throw new Error('Fiyat fonksiyonu bulunamadı. Supabase > Edge Functions altında adı tam olarak "fiyat" olmalı.');
    throw new Error((j && (j.hata || j.message)) || ('HTTP ' + c.status));
  }
  return j;
}

/* Portföyde geçen tüm sembolleri türlerine göre toplar */
function izlenenSemboller(){
  const bist = new Set(), fon = new Set(), doviz = new Set(['USD']);
  (D.trades||[]).forEach(t => {
    if(!t.sembol) return;
    (t.tur === 'fon' ? fon : bist).add(String(t.sembol).toUpperCase());
  });
  (D.yatirimlar||[]).forEach(y => {
    const s = String(y.sembol||'').toUpperCase();
    if(!s) return;
    if(y.tur === 'bist_hisse') bist.add(s);
    else if(y.tur === 'yatirim_fonu') fon.add(s);
    else if(y.tur === 'doviz') doviz.add(s);
  });
  (D.hesaplar||[]).forEach(h => { if(h.paraBirimi && h.paraBirimi !== 'TRY') doviz.add(h.paraBirimi); });
  (D.varliklar||[]).forEach(v => { if(v.paraBirimi && v.paraBirimi !== 'TRY') doviz.add(v.paraBirimi); });
  return {bist:[...bist], fon:[...fon], doviz:[...doviz]};
}

/* Sembolleri küçük gruplara böler: her istek kısa sürer, sonuçlar
   geldikçe ekrana yansır, uzun listelerde zaman aşımı olmaz. */
function gruplara(dizi, boy){
  const g = [];
  for(let i = 0; i < dizi.length; i += boy) g.push(dizi.slice(i, i + boy));
  return g;
}

let FIYAT_SURE = 28000;     // bir grup en çok bu kadar bekler, sonra sıradakine geçilir
let FIYAT_ESZAMAN = 3;      // aynı anda kaç grup istenir
let FIYAT_GRUP = {bist:6, doviz:6, fon:3};

let fiyatAliniyor = false;
let fiyatIlerleme = '';
let fiyatIptal = false;

/* Fiyat düğmelerini güncel duruma göre yazar; her çizimden sonra çağrılır.
   Alım sürerken düğme kapanmaz: aynı düğmeye basınca iş durdurulur. */

  });

/* Bir grubu ister, gelen fiyatları veriye işler. Hata atmaz; sonuç döndürür. */
async function fiyatGrubuAl(is, simdi){
  const semboller = [];
  Object.values(is).forEach(v => String(v).split(',').forEach(x => x && semboller.push(x)));
  try{
    const j = await fiyatIstek({...is, __sure: FIYAT_SURE});
    if(!j || !j.ok) throw new Error((j && j.hata) || 'Servis yanıt vermedi');
    const v = j.veri || {};
    let gelen = 0;
    Object.keys(v).forEach(kod => {
      const g = v[kod];
      if(!(say(g.fiyat) > 0)) return;
      const eski = (D.fiyatlar||[]).find(f => f.sembol === kod) || {};
      D.fiyatlar = (D.fiyatlar||[]).filter(f => f.sembol !== kod);
      D.fiyatlar.push({sembol:kod, tur:g.tur || eski.tur || 'elle', fiyat: say(g.fiyat),
        guncelleme: g.tarih || simdi.slice(0,10), zaman: simdi, ad: g.ad || eski.ad || ''});
      gelen++;
    });
    if(gelen){ isaretle('fiyatlar'); ciz(); }   // gelen sonuç hemen ekrana yansır
    return {gelen, eksik: (j.eksik || []).slice(), hata: ''};
  }catch(e){
    return {gelen: 0, eksik: semboller, hata: e.message};
  }
}

async function fiyatlariTazele({sessiz=false}={}){
  if(fiyatAliniyor){
    fiyatIptal = true;                          // ikinci tıklama: durdur
    fiyatIlerleme = 'Durduruluyor…';
    dugmeYaz(); durumYaz(fiyatIlerleme);
    return;
  }
  const s = izlenenSemboller();
  const isler = [];
  gruplara(s.bist, FIYAT_GRUP.bist).forEach(g => isler.push({bist:g.join(',')}));
  gruplara(s.doviz.filter(x => x !== 'TRY'), FIYAT_GRUP.doviz).forEach(g => isler.push({doviz:g.join(',')}));
  gruplara(s.fon, FIYAT_GRUP.fon).forEach(g => isler.push({fon:g.join(',')}));

  if(!isler.length){
    if(!sessiz) bildir('İzlenecek sembol yok. Önce bir işlem ya da pozisyon ekle.');
    return;
  }

  fiyatAliniyor = true;
  fiyatIptal = false;
  fiyatIlerleme = '';

  const simdi = new Date().toISOString();
  let gelen = 0, bitti = 0;
  let eksik = [];
  const hatalar = [];

  let etiket = 'Alınıyor';
  const ilerleme = (toplam) => {
    fiyatIlerleme = toplam > 1
      ? `${etiket} ${Math.min(bitti + 1, toplam)}/${toplam}` : etiket + '…';
    dugmeYaz();
    durumYaz(fiyatIlerleme);
  };

  /* Bir turda sıradaki grupları paralel yürütür; takılan grup diğerlerini
     bekletmez, zaman aşımına uğrayıp sıradakine geçilir. */
  async function turuYurut(liste){
    const sira = liste.slice();
    const kalan = [];
    bitti = 0;
    ilerleme(sira.length);
    const toplam = sira.length;
    const isci = async () => {
      while(sira.length && !fiyatIptal){
        const is = sira.shift();
        const sonuc = await fiyatGrubuAl(is, simdi);
        gelen += sonuc.gelen;
        if(sonuc.hata){ hatalar.push(sonuc.hata); kalan.push(is); }
        else if(sonuc.eksik.length) kalan.push({...is, __eksik: sonuc.eksik});
        bitti++;
        ilerleme(toplam);
      }
    };
    await Promise.all(Array.from({length: Math.min(FIYAT_ESZAMAN, sira.length)}, isci));
    sira.forEach(is => kalan.push(is));        // durdurulduysa sıradakiler
    return kalan;
  }

  try{
    let kalan = await turuYurut(isler);

    /* İkinci tur: yalnızca gelmeyen semboller, daha küçük gruplarla.
       Dış kaynak anlık hata verdiyse çoğu bu turda gelir. */
    if(kalan.length && !fiyatIptal){
      const tekrar = [];
      kalan.forEach(is => {
        const tp = is.bist !== undefined ? 'bist' : (is.doviz !== undefined ? 'doviz' : 'fon');
        const semboller = is.__eksik || String(is[tp] || '').split(',').filter(Boolean);
        gruplara(semboller, tp === 'fon' ? 2 : 3).forEach(g => {
          if(g.length) tekrar.push({[tp]: g.join(',')});
        });
      });
      if(tekrar.length){
        etiket = 'Tekrar';
        const son = await turuYurut(tekrar);
        son.forEach(is => {
          const t = is.bist !== undefined ? 'bist' : (is.doviz !== undefined ? 'doviz' : 'fon');
          (is.__eksik || String(is[t] || '').split(',')).forEach(x => x && eksik.push(x));
        });
      }
    } else {
      kalan.forEach(is => {
        const t = is.bist !== undefined ? 'bist' : (is.doviz !== undefined ? 'doviz' : 'fon');
        (is.__eksik || String(is[t] || '').split(',')).forEach(x => x && eksik.push(x));
      });
    }
  } finally {
    fiyatAliniyor = false;
    fiyatIlerleme = '';
    const durduruldu = fiyatIptal;
    fiyatIptal = false;
    ciz();
    if(durduruldu){
      durumYaz(gelen + ' fiyat güncellendi · durduruldu', gelen ? 'ok' : 'hata');
      if(!sessiz) bildir('Fiyat güncellemesi durduruldu. ' + gelen + ' fiyat geldi.');
      return;
    }
  }

  eksik = [...new Set(eksik.filter(x => !(D.fiyatlar||[]).some(
    f => f.sembol === x && f.zaman === simdi)))];

  if(gelen) durumYaz(gelen + ' fiyat güncellendi', 'ok');
  else durumYaz('Fiyat alınamadı', 'hata');
  ciz();

  if(sessiz) return;
  if(hatalar.length && !gelen){
    bildir('Fiyat alınamadı: ' + hatalar[0] + ' — Ayarlar > Bağlantıyı sına ile bakabilirsin.');
  } else if(eksik.length){
    const kisa = eksik.slice(0, 6).join(', ') + (eksik.length > 6 ? ' ve ' + (eksik.length-6) + ' tane daha' : '');
    bildir(gelen + ' fiyat geldi · ' + eksik.length + ' sembolde yok: ' + kisa +
      ' — Ayarlar > Eksikleri incele ile sebebini görebilirsin.');
  } else if(gelen){
    bildir(gelen + ' fiyat güncellendi.');
  }
}

/* ---------- adres denetimi ---------- */
function adresSorunu(u){
  if(!u) return 'Adres boş. Apps Script dağıtımından aldığın /exec adresini yapıştır.';
  if(/docs\.google\.com\/spreadsheets/.test(u))
    return 'Bu e-tablonun kendi adresi. Gereken adres, Apps Script’i “Dağıt > Web uygulaması” ile yayınlayınca verilen script.google.com/macros/s/…/exec adresi.';
  if(!/^https:\/\//.test(u)) return 'Adres https:// ile başlamalı.';
  if(!/script\.google\.com/.test(u))
    return 'Adres script.google.com alan adında olmalı. Apps Script dağıtımındaki /exec adresini kullan.';
  if(!/\/exec$/.test(u))
    return u.indexOf('/dev') > -1
      ? 'Bu test (/dev) adresi, yalnızca senin oturumunda çalışır. Dağıtımdaki /exec adresini kullan.'
      : 'Adres /exec ile bitmeli. Dağıt > Web uygulaması ekranındaki adresi olduğu gibi kopyala.';
  return '';
}

/* ===================================================================
   HESAPLAMALAR
   =================================================================== */

function kur(kod){
  if(!kod || kod === 'TRY') return 1;
  const f = (D.fiyatlar||[]).find(x => x.sembol === kod);
  return f && say(f.fiyat) > 0 ? say(f.fiyat) : 1;
}
function tl(tutar, kb){ return say(tutar) * kur(kb); }
/* Enstrüman fiyatı: bilinmiyorsa 0 döner, böylece değer yanlış hesaplanmaz */
function fiyatBul(sembol){
  const f = (D.fiyatlar||[]).find(x => x.sembol === String(sembol||'').toUpperCase());
  return f ? say(f.fiyat) : 0;
}
function hesap(id){ return (D.hesaplar||[]).find(h => h.id === id); }
function kategori(id){ return (D.kategoriler||[]).find(k => k.id === id); }
function kokKategori(id){
  let k = kategori(id);
  if(!k) return null;
  while(k && k.parentId){ const u = kategori(k.parentId); if(!u) break; k = u; }
  return k;
}
function kategoriAd(id){
  const k = kategori(id); if(!k) return '—';
  const u = k.parentId ? kategori(k.parentId) : null;
  return u ? u.ad + ' › ' + k.ad : k.ad;
}
function anaKategoriler(yon){
  return (D.kategoriler||[]).filter(k => !k.parentId && !bool(k.arsiv) && (!yon || k.yon === yon));
}

/* Bir işlemin aylara dağılımı: [{donem, tutar}] */
function islemPaylari(i){
  const n = say(i.taksitSayisi);
  if(i.butceYansimasi !== 'taksitli' || n < 2)
    return [{donem: donemStr(i.tarih), tutar: say(i.tryTutar)}];
  const pay = say(i.tryTutar) / n;
  const bas = donemStr(i.tarih);
  return Array.from({length:n}, (_,x) => ({donem: ayEkle(bas, x), tutar: pay, sira: x+1}));
}

/* Hesap bakiyesi (hesabın kendi para biriminde) */
function bakiye(hesapId){
  const h = hesap(hesapId); if(!h) return 0;
  let b = say(h.acilisBakiye);
  (D.islemler||[]).forEach(i => {
    const t = say(i.tutar);
    if(i.hesapId === hesapId){
      if(i.tur === 'gelir') b += t;
      else b -= t;                    // gider ve transfer çıkışı
    }
    if(i.hedefHesapId === hesapId && i.tur === 'transfer') b += t;
  });
  return b;
}

/* Kart borcu: vadesi gelmiş taksitler dahil, ödemeler düşülmüş */
function kartPaylari(hesapId, i){
  const n = say(i.taksitSayisi);
  if(n < 2) return [{donem: kartDonemi(hesapId, i.tarih), tutar: say(i.tryTutar)}];
  const ilk = kartDonemi(hesapId, i.tarih);
  return Array.from({length:n}, (_,x) => ({donem: ayEkle(ilk, x), tutar: say(i.tryTutar)/n}));
}
function kartBorc(hesapId){
  const buAy = donemStr(bugun());
  let borc = 0;
  (D.islemler||[]).forEach(i => {
    if(i.hesapId === hesapId && i.tur === 'gider'){
      kartPaylari(hesapId, i).forEach(p => { if(p.donem <= buAy) borc += p.tutar; });
    }
    if(i.hedefHesapId === hesapId && i.tur === 'transfer') borc -= say(i.tryTutar);
  });
  return borc;
}
/* Henüz vadesi gelmemiş taksit yükü */
function kalanTaksitYuku(hesapId){
  const buAy = donemStr(bugun());
  let t = 0;
  (D.islemler||[]).forEach(i => {
    if(i.hesapId === hesapId && i.tur === 'gider')
      kartPaylari(hesapId, i).forEach(p => { if(p.donem > buAy) t += p.tutar; });
  });
  return t;
}

/* Bir kart harcamasının hangi ekstre dönemine düştüğü.
   Kesim gününden sonraki harcamalar bir sonraki ekstreye gider. */
function kartDonemi(hesapId, tarih){
  const h = hesap(hesapId) || {};
  const kesim = say(h.kesimGunu) || 1;
  const t = new Date(tarih);
  const d = donemStr(t);
  return t.getDate() > Math.min(kesim, ayGunSayisi(d)) ? ayEkle(d, 1) : d;
}

/* Bir ekstre dönemine düşen hareketler */
function ekstreHareketleri(hesapId, donem){
  const satirlar = [];
  (D.islemler||[]).forEach(i => {
    if(i.hesapId === hesapId && i.tur === 'gider'){
      const n = say(i.taksitSayisi);
      if(n > 1){
        const ilk = kartDonemi(hesapId, i.tarih);
        const fark = (donemTarih(donem).getFullYear() - donemTarih(ilk).getFullYear()) * 12
          + (donemTarih(donem).getMonth() - donemTarih(ilk).getMonth());
        if(fark >= 0 && fark < n)
          satirlar.push({tarih:i.tarih, ad:i.aciklama || kategoriAd(i.kategoriId),
            alt:`${kategoriAd(i.kategoriId)} · ${fark+1}/${n} taksit`,
            tutar: say(i.tryTutar)/n, tur:'harcama', id:i.id});
      } else if(kartDonemi(hesapId, i.tarih) === donem){
        satirlar.push({tarih:i.tarih, ad:i.aciklama || kategoriAd(i.kategoriId),
          alt:kategoriAd(i.kategoriId), tutar: say(i.tryTutar), tur:'harcama', id:i.id});
      }
    }
    if(i.hedefHesapId === hesapId && i.tur === 'transfer' && donemStr(i.tarih) === donem){
      satirlar.push({tarih:i.tarih, ad:i.aciklama || 'Kart ödemesi',
        alt: hesap(i.hesapId) ? hesap(i.hesapId).ad : '', tutar: -say(i.tryTutar),
        tur:'odeme', id:i.id});
    }
  });
  return satirlar.sort((a,b) => a.tarih < b.tarih ? 1 : -1);
}

/* Kart ekstresi (verilen dönem için) */
function ekstre(hesapId, donem){
  const h = hesap(hesapId) || {};
  const kesim = say(h.kesimGunu) || 1;
  const sonOdemeGun = say(h.sonOdemeGunu) || 10;
  const d = donemTarih(donem);
  const bit = new Date(d.getFullYear(), d.getMonth(), Math.min(kesim, ayGunSayisi(donem)));
  const bas = new Date(bit); bas.setMonth(bas.getMonth()-1); bas.setDate(bas.getDate()+1);
  let hesaplanan = 0;
  (D.islemler||[]).forEach(i => {
    if(i.hesapId !== hesapId || i.tur !== 'gider') return;
    const n = say(i.taksitSayisi);
    if(n > 1){
      // taksitler, alışverişin düştüğü ekstre döneminden başlar
      const ilk = kartDonemi(hesapId, i.tarih);
      const fark = (donemTarih(donem).getFullYear() - donemTarih(ilk).getFullYear()) * 12
        + (donemTarih(donem).getMonth() - donemTarih(ilk).getMonth());
      if(fark >= 0 && fark < n) hesaplanan += say(i.tryTutar) / n;
    } else {
      const t = new Date(i.tarih);
      if(t >= bas && t <= bit) hesaplanan += say(i.tryTutar);
    }
  });
  const kayit = (D.ekstreler||[]).find(e => e.hesapId === hesapId && e.donem === donem) || {};
  const oncekiDonem = ayEkle(donem, -1);
  const onceki = (D.ekstreler||[]).find(e => e.hesapId === hesapId && e.donem === oncekiDonem);
  let devreden = 0, tahminiFaiz = 0;
  if(onceki){
    // önceki dönemden ödenmeden kalan her şey (borç + devir + faiz) devreder
    const oncekiE = ekstre(hesapId, oncekiDonem);
    devreden = Math.max(0, oncekiE.kalan);
    tahminiFaiz = say(kayit.gercekFaiz) || devreden * (say(h.faizOrani)||0);
  }
  const gecerli = say(kayit.bankaTutari) || hesaplanan;
  const sonOdeme = new Date(d.getFullYear(), d.getMonth(), Math.min(sonOdemeGun, ayGunSayisi(donem)));
  if(sonOdemeGun < kesim) sonOdeme.setMonth(sonOdeme.getMonth()+1);
  const toplamBorc = gecerli + devreden + tahminiFaiz;
  const odenen = say(kayit.odenen);
  const asgari = toplamBorc * (say(h.asgariOran) || 0.2);
  return {
    hesapId, donem, hesaplanan, bankaTutari: kayit.bankaTutari, gecerli,
    devreden, tahminiFaiz, odenen, toplamBorc, asgari,
    asgariKarsilandi: toplamBorc > 0 && odenen >= asgari - 0.5,
    tamOdendi: toplamBorc > 0 && odenen >= toplamBorc - 0.5,
    kesimTarihi: bit, sonOdemeTarihi: sonOdeme,
    kalan: toplamBorc - odenen,
    kayitId: kayit.id
  };
}

/* Bütçe: bir ana kategorinin dönem harcaması */
function kategoriHarcama(anaKatId, donem){
  let t = 0;
  (D.islemler||[]).forEach(i => {
    if(i.tur !== 'gider') return;
    const kok = kokKategori(i.kategoriId);
    if(!kok || kok.id !== anaKatId) return;
    islemPaylari(i).forEach(p => { if(p.donem === donem) t += p.tutar; });
  });
  return t;
}
function butceSatir(anaKatId, donem){
  const b = (D.butce||[]).find(x => x.kategoriId === anaKatId && x.donem === donem);
  return b ? say(b.limitTutari) : 0;
}
/* Devir: önceki aylardan gelen artı ya da eksi (24 ay geriye kadar) */
function devir(anaKatId, donem, derinlik=0){
  if(derinlik > 24) return 0;
  const onceki = ayEkle(donem, -1);
  const limit = butceSatir(anaKatId, onceki);
  if(!limit) return 0;
  const harcanan = kategoriHarcama(anaKatId, onceki);
  return limit + devir(anaKatId, onceki, derinlik+1) - harcanan;
}
function butceOzet(donem){
  const kats = anaKategoriler('gider').map(k => {
    const limit = butceSatir(k.id, donem);
    const dvr = devir(k.id, donem);
    const harcanan = kategoriHarcama(k.id, donem);
    return {kat:k, limit, devir:dvr, etkin:limit+dvr, harcanan, kalan:limit+dvr-harcanan};
  }).filter(x => x.limit > 0 || x.harcanan > 0 || x.devir !== 0);
  const toplamLimit = kats.reduce((a,x)=>a+x.etkin,0);
  const toplamSade = kats.reduce((a,x)=>a+x.limit,0);
  const toplamDevir = kats.reduce((a,x)=>a+x.devir,0);
  const toplamHarcanan = kats.reduce((a,x)=>a+x.harcanan,0);
  const gunSayisi = ayGunSayisi(donem);
  const bu = donemStr(bugun()) === donem;
  const gecen = bu ? bugun().getDate() : gunSayisi;
  const kalanGun = Math.max(1, gunSayisi - gecen + (bu?1:0));
  return {
    kats, toplamLimit, toplamSade, toplamDevir, toplamHarcanan,
    kalan: toplamLimit - toplamHarcanan,
    gunluk: Math.max(0, (toplamLimit - toplamHarcanan) / kalanGun),
    kalanGun,
    aySonuTahmin: gecen ? toplamHarcanan / gecen * gunSayisi : 0
  };
}

/* Gelir bütçesi: planlanan ve gerçekleşen */
function kategoriGelir(anaKatId, donem){
  let t = 0;
  (D.islemler||[]).forEach(i => {
    if(i.tur !== 'gelir') return;
    if(donemStr(i.tarih) !== donem) return;
    const kok = kokKategori(i.kategoriId);
    if(!kok || kok.id !== anaKatId) return;
    t += say(i.tryTutar);
  });
  return t;
}
function gelirOzet(donem){
  const kats = anaKategoriler('gelir').map(k => {
    const plan = butceSatir(k.id, donem);
    const gercek = kategoriGelir(k.id, donem);
    return {kat:k, plan, gercek, fark: gercek - plan};
  }).filter(x => x.plan > 0 || x.gercek > 0);
  const toplamPlan = kats.reduce((a,x) => a + x.plan, 0);
  const toplamGercek = kats.reduce((a,x) => a + x.gercek, 0);
  const gunSayisi = ayGunSayisi(donem);
  const bu = donemStr(bugun()) === donem;
  const gecen = bu ? bugun().getDate() : gunSayisi;
  return {
    kats, toplamPlan, toplamGercek,
    fark: toplamGercek - toplamPlan,
    bekleyen: Math.max(0, toplamPlan - toplamGercek),
    aySonuTahmin: gecen ? toplamGercek / gecen * gunSayisi : 0
  };
}
/* Planlanan tasarruf: gelir bütçesi eksi gider bütçesi */
function tasarrufOzet(donem){
  const g = gelirOzet(donem), x = butceOzet(donem);
  return {
    planlanan: g.toplamPlan - x.toplamSade,
    gerceklesen: g.toplamGercek - x.toplamHarcanan
  };
}

/* Yaklaşan ödemeler */
function yaklasanOdemeler(gun=30){
  const b = bugun(); const liste = [];
  (D.borcTaksitleri||[]).forEach(t => {
    if(bool(t.odendi)) return;
    const f = gunFark(t.vade, b);
    if(f > gun) return;
    const borc = (D.borclar||[]).find(x => x.id === t.borcId);
    if(!borc || borc.durum === 'kapandi') return;
    liste.push({tur: borc.tur === 'kredi' ? 'Kredi' : 'Tasarruf finansman',
      ad: borc.ad, alt: t.sira + '. taksit', tarih: t.vade, tutar: say(t.tutar),
      gun: f, kaynak: 'taksit', id: t.id});
  });
  (D.hesaplar||[]).filter(h => h.tur === 'kredi_karti' && !bool(h.arsiv)).forEach(h => {
    const e = ekstre(h.id, donemStr(b));
    if(e.kalan <= 0 || e.asgariKarsilandi) return;
    const f = gunFark(e.sonOdemeTarihi, b);
    if(f > gun || f < -60) return;
    liste.push({tur:'Kart', ad:h.ad, alt:'Son ödeme', tarih: ymd(e.sonOdemeTarihi),
      tutar: e.kalan, asgari: Math.max(0, e.asgari - e.odenen), gun: f, kaynak:'kart', id: h.id});
  });
  (D.tekrarlayanlar||[]).filter(r => bool(r.aktif)).forEach(r => {
    const f = gunFark(r.sonrakiTarih, b);
    if(f > gun) return;
    liste.push({tur:'Tekrarlayan', ad:r.ad, alt: r.tur === 'gelir' ? 'Gelir' : 'Gider',
      tarih: r.sonrakiTarih, tutar: say(r.tutar), gun: f, kaynak:'tekrar', id: r.id});
  });
  return liste.sort((a,b2) => a.tarih < b2.tarih ? -1 : 1);
}

/* ===================================================================
   PORTFÖY — işlemlerden pozisyon ve kâr/zarar
   Ortalama maliyet yöntemi. USD maliyeti işlem günündeki kurla
   sabitlenir, böylece gerçek dolar getirisi hesaplanır.
   =================================================================== */

const TRADE_YON = {alis:'Alış', satis:'Satış', temettu:'Temettü',
  bedelsiz:'Bedelsiz', bolunme:'Bölünme'};

function tradeKur(t){
  const k = say(t.usdKuru);
  return k > 0 ? k : (kur('USD') || 1);
}

/* Bir sembolün tüm hareketlerini sırayla işler */
/* Aynı gün içindeki işlemlerin işlenme sırası. Gün içinde alıp satmak sık
   görülür; kayıt sırası ne olursa olsun önce alış ve pay değişiklikleri,
   sonra satış, en son temettü işlenir. Yoksa satış "elde yok" sayılıp
   sessizce atlanır ve adet olduğundan fazla görünür. */
const TRADE_SIRA_GUN = {alis:0, bedelsiz:1, bolunme:1, satis:2, temettu:3};

function pozisyonHesapla(sembol){
  const hareketler = (D.trades||[])
    .filter(t => String(t.sembol||'').toUpperCase() === String(sembol).toUpperCase())
    .sort((a,b) => {
      if(a.tarih !== b.tarih) return a.tarih < b.tarih ? -1 : 1;
      const x = TRADE_SIRA_GUN[a.yon] ?? 9, y = TRADE_SIRA_GUN[b.yon] ?? 9;
      if(x !== y) return x - y;
      return a.id < b.id ? -1 : 1;
    });

  let adet = 0, maliyet = 0, maliyetUsd = 0;
  let realizeTl = 0, realizeUsd = 0, temettuTl = 0, temettuUsd = 0;
  let ad = '', tur = 'hisse';
  let fazlaSatis = 0;                      // elde olandan fazla satılan adet
  const kapanan = [];

  hareketler.forEach(t => {
    const k = tradeKur(t);
    if(t.ad) ad = t.ad;
    if(t.tur) tur = t.tur;
    const a = say(t.adet), f = say(t.fiyat);

    if(t.yon === 'alis'){
      adet += a;
      maliyet += a * f;
      maliyetUsd += (a * f) / k;
    }
    else if(t.yon === 'satis'){
      if(a > adet + 0.0000001) fazlaSatis += a - Math.max(adet, 0);
      if(adet <= 0) return;
      const sat = Math.min(a, adet);
      const birim = maliyet / adet;
      const birimUsd = maliyetUsd / adet;
      const kzTl = sat * f - sat * birim;
      const kzUsd = (sat * f) / k - sat * birimUsd;
      realizeTl += kzTl; realizeUsd += kzUsd;
      kapanan.push({tarih:t.tarih, sembol, ad, tur, adet:sat, fiyat:f,
        maliyet:birim, kzTl, kzUsd, kur:k,
        oran: birim > 0 ? (f / birim - 1) : 0,
        oranUsd: birimUsd > 0 ? ((f / k) / birimUsd - 1) : 0, id:t.id});
      adet -= sat;
      maliyet -= sat * birim;
      maliyetUsd -= sat * birimUsd;
      if(adet < 0.0000001){ adet = 0; maliyet = 0; maliyetUsd = 0; }
    }
    else if(t.yon === 'temettu'){
      const net = say(t.fiyat);           // doğrudan net tutar
      temettuTl += net;
      temettuUsd += net / k;
      if(adet > 0.0000001){
        // temettü maliyeti düşürür, böylece hisse kârına yansır
        maliyet -= net;
        maliyetUsd -= net / k;
      } else {
        // pozisyon kapalıyken gelen temettü doğrudan gerçekleşen kâra yazılır
        realizeTl += net;
        realizeUsd += net / k;
      }
    }
    else if(t.yon === 'bedelsiz'){
      adet += adet * say(t.oran);          // oran 0.5 = %50 bedelsiz
    }
    else if(t.yon === 'bolunme'){
      const c = say(t.oran);
      if(c > 0) adet *= c;                  // 2 = bir pay iki paya bölündü
    }
  });

  const fiyat = fiyatBul(sembol);
  const deger = adet * fiyat;
  const usdKuru = kur('USD') || 1;
  return {
    sembol: String(sembol).toUpperCase(), ad, tur,
    adet, maliyet, maliyetUsd,
    birim: adet > 0 ? maliyet / adet : 0,
    birimUsd: adet > 0 ? maliyetUsd / adet : 0,
    fiyat, deger, degerUsd: deger / usdKuru,
    acikKzTl: deger - maliyet,
    acikKzUsd: deger / usdKuru - maliyetUsd,
    acikOran: maliyet > 0 ? (deger / maliyet - 1) : 0,
    acikOranUsd: maliyetUsd > 0 ? ((deger / usdKuru) / maliyetUsd - 1) : 0,
    realizeTl, realizeUsd, temettuTl, temettuUsd,
    toplamKzTl: (deger - maliyet) + realizeTl,
    toplamKzUsd: (deger / usdKuru - maliyetUsd) + realizeUsd,
    kapanan, hareketSayisi: hareketler.length,
    fazlaSatis,                            // 0'dan büyükse kayıt eksik demektir
    fiyatVar: fiyat > 0
  };
}

function tumPozisyonlar(){
  const semboller = [...new Set((D.trades||[])
    .map(t => String(t.sembol||'').toUpperCase()).filter(Boolean))];
  return semboller.map(pozisyonHesapla)
    .sort((a,b) => b.deger - a.deger);
}

function portfoyOzet(filtre){
  const hepsi = tumPozisyonlar().filter(p => !filtre || p.tur === filtre);
  const acik = hepsi.filter(p => p.adet > 0.0000001);
  const fiyatli = acik.filter(p => p.fiyat > 0);
  const fiyatsiz = acik.filter(p => !(p.fiyat > 0));
  const usdKuru = kur('USD') || 1;
  const t = {
    pozisyonlar: hepsi, acik, fiyatli, fiyatsiz,
    deger: fiyatli.reduce((a,p) => a + p.deger, 0),
    maliyet: fiyatli.reduce((a,p) => a + p.maliyet, 0),
    maliyetUsd: fiyatli.reduce((a,p) => a + p.maliyetUsd, 0),
    realizeTl: hepsi.reduce((a,p) => a + p.realizeTl, 0),
    realizeUsd: hepsi.reduce((a,p) => a + p.realizeUsd, 0),
    temettuTl: hepsi.reduce((a,p) => a + p.temettuTl, 0),
    temettuUsd: hepsi.reduce((a,p) => a + p.temettuUsd, 0),
    usdKuru
  };
  t.degerUsd = t.deger / usdKuru;
  t.acikKzTl = t.deger - t.maliyet;
  t.acikKzUsd = t.degerUsd - t.maliyetUsd;
  t.acikOran = t.maliyet > 0 ? (t.deger / t.maliyet - 1) : 0;
  t.acikOranUsd = t.maliyetUsd > 0 ? (t.degerUsd / t.maliyetUsd - 1) : 0;
  t.toplamKzTl = t.acikKzTl + t.realizeTl;
  t.toplamKzUsd = t.acikKzUsd + t.realizeUsd;
  t.kapanan = hepsi.flatMap(p => p.kapanan).sort((a,b) => a.tarih < b.tarih ? 1 : -1);
  return t;
}

/* ===================================================================
   EMİR KURALLARI
   Referans, o sembolde yapılan son alım ya da satımın fiyatıdır.
   Fiyat referanstan istenen oranda düşerse alış, yükselirse satış
   sinyali üretilir. Adet, tutarın güncel fiyata bölünüp yukarı
   yuvarlanmasıyla bulunur.
   =================================================================== */

const EMIR_VARSAYILAN = {alisTutar:0, alisDusus:0, satisTutar:0, satisArtis:0};
let emirSira = '';   // tablo: '' | sembol | degisim
let emirAlisSira = 'yakin';    // sütunlar: yakin | degisim | sembol | fiyat | tutar
let emirSatisSira = 'yakin';

function genelKural(){
  const g = (D.emirKurallari||[]).find(k => !k.sembol || k.sembol === '*');
  return {...EMIR_VARSAYILAN, ...(g||{}), sembol:'*',
    id: g ? g.id : ''};
}
function sembolKurali(sembol){
  const s = String(sembol||'').toUpperCase();
  const genel = genelKural();
  const ozel = (D.emirKurallari||[]).find(k => String(k.sembol||'').toUpperCase() === s && s);
  if(!ozel) return {...genel, sembol:s, ozel:false};
  const birles = {...genel};
  ['alisTutar','alisDusus','satisTutar','satisArtis'].forEach(a => {
    if(ozel[a] !== '' && ozel[a] !== undefined && ozel[a] !== null) birles[a] = say(ozel[a]);
  });
  return {...birles, sembol:s, ozel:true, id:ozel.id};
}

/* Bir sembolde yapılan son alım/satımın fiyatı */
function sonIslemFiyati(sembol){
  const liste = (D.trades||[])
    .filter(t => String(t.sembol||'').toUpperCase() === String(sembol).toUpperCase()
      && (t.yon === 'alis' || t.yon === 'satis') && say(t.fiyat) > 0)
    .sort((a,b) => a.tarih === b.tarih ? (a.id < b.id ? -1 : 1) : (a.tarih < b.tarih ? -1 : 1));
  const son = liste[liste.length - 1];
  return son ? {fiyat: say(son.fiyat), tarih: son.tarih, yon: son.yon} : null;
}

function emirDurumu(sembol){
  const p = pozisyonHesapla(sembol);
  const k = sembolKurali(sembol);
  const son = sonIslemFiyati(sembol);
  const guncel = p.fiyat;
  const d = {
    sembol: p.sembol, ad: p.ad, tur: p.tur, kural: k,
    adet: p.adet, guncel, referans: son ? son.fiyat : 0,
    referansTarih: son ? son.tarih : '', referansYon: son ? son.yon : '',
    hazir: !!(son && guncel > 0)
  };
  if(!d.hazir) return d;

  d.degisim = guncel / d.referans - 1;
  d.dusus  = -d.degisim;        // pozitifse fiyat son işlemin altında
  d.artis  =  d.degisim;        // pozitifse üstünde

  if(say(k.alisTutar) > 0 && say(k.alisDusus) > 0){
    d.alisEsik = say(k.alisDusus);
    d.alisHedef = d.referans * (1 - d.alisEsik);
    d.alisTetik = guncel <= d.alisHedef + 0.0000001;
    d.alisAdet = Math.ceil(say(k.alisTutar) / guncel);
    d.alisTutar = d.alisAdet * guncel;
    d.alisUzaklik = guncel > 0 ? d.alisHedef / guncel - 1 : 0;  // hedefe kalan oran
    // Eşiğe doğru yol alınan kısım: 0 = hiç düşmemiş, 1 = eşiğe ulaşmış
    d.alisOran = Math.max(0, Math.min(d.dusus / d.alisEsik, 1));
    // Emir sayfasında görünme koşulu: düşüş 0 ile eşik arasında ya da eşiği aşmış
    d.alisAralikta = d.dusus >= -0.0000001;
  }
  if(say(k.satisTutar) > 0 && say(k.satisArtis) > 0){
    d.satisEsik = say(k.satisArtis);
    d.satisHedef = d.referans * (1 + d.satisEsik);
    d.satisTetikFiyat = guncel >= d.satisHedef - 0.0000001;
    d.satisAdetHam = Math.ceil(say(k.satisTutar) / guncel);
    d.satisAdet = Math.min(d.satisAdetHam, Math.floor(p.adet));
    d.satisKisitli = d.satisAdet < d.satisAdetHam;
    d.satisTutarTl = d.satisAdet * guncel;
    d.satisTetik = d.satisTetikFiyat && d.satisAdet > 0;
    d.satisUzaklik = guncel > 0 ? d.satisHedef / guncel - 1 : 0;
    d.satisOran = Math.max(0, Math.min(d.artis / d.satisEsik, 1));
    d.satisAralikta = d.artis >= -0.0000001 && p.adet > 0;
  }
  return d;
}

function emirListesi(){
  const semboller = [...new Set((D.trades||[])
    .map(t => String(t.sembol||'').toUpperCase()).filter(Boolean))];
  return semboller.map(emirDurumu).sort((a,b) => {
    const p = x => (x.alisTetik || x.satisTetik) ? 0 : (x.hazir ? 1 : 2);
    if(p(a) !== p(b)) return p(a) - p(b);
    return a.sembol < b.sembol ? -1 : 1;
  });
}

/* Net varlık */
function netVarlik(){
  let varlik = 0, borc = 0;
  const kalem = [];
  (D.hesaplar||[]).forEach(h => {
    if(bool(h.arsiv) || h.netVarligaDahil === false) return;
    if(h.tur === 'kredi_karti'){
      const b = kartBorc(h.id) + kalanTaksitYuku(h.id);
      if(b > 0){ borc += b; kalem.push({grup:'Kart borcu', ad:h.ad, tutar:-b}); }
      return;
    }
    const b = tl(bakiye(h.id), h.paraBirimi);
    if(b >= 0){ varlik += b; kalem.push({grup: h.tur === 'vadeli' ? 'Vadeli' : 'Nakit', ad:h.ad, tutar:b}); }
    else { borc += -b; kalem.push({grup:'Hesap borcu', ad:h.ad, tutar:b}); }
  });
  (D.yatirimlar||[]).forEach(y => {
    const d = say(y.adet) * fiyatBul(y.sembol);
    if(d <= 0) return;
    varlik += d; kalem.push({grup:'Yatırım', ad:y.sembol, tutar:d});
  });
  tumPozisyonlar().forEach(p => {
    if(p.adet <= 0.0000001 || p.deger <= 0) return;
    varlik += p.deger;
    kalem.push({grup: p.tur === 'fon' ? 'Fon' : 'Hisse', ad:p.sembol, tutar:p.deger});
  });
  (D.varliklar||[]).forEach(v => {
    if(v.netVarligaDahil === false) return;
    const d = tl(v.guncelDeger, v.paraBirimi);
    varlik += d; kalem.push({grup:'Varlık', ad:v.ad, tutar:d});
  });
  (D.borcTaksitleri||[]).forEach(t => {
    if(bool(t.odendi)) return;
    const b = (D.borclar||[]).find(x => x.id === t.borcId);
    if(!b || b.durum === 'kapandi') return;
    borc += say(t.tutar);
  });
  (D.kisiBorclari||[]).forEach(k => {
    if(k.durum === 'kapandi') return;
    const kalanT = tl(say(k.tutar) - say(k.odenen), k.paraBirimi);
    if(k.yon === 'alacak'){ varlik += kalanT; kalem.push({grup:'Alacak', ad:k.ad, tutar:kalanT}); }
    else { borc += kalanT; }
  });
  return {varlik, borc, net: varlik - borc, kalem};
}
function grupDagilim(){
  const {kalem} = netVarlik();
  const g = {};
  kalem.filter(k => k.tutar > 0).forEach(k => g[k.grup] = (g[k.grup]||0) + k.tutar);
  const top = Object.values(g).reduce((a,b)=>a+b,0) || 1;
  return Object.entries(g).map(([ad,tutar]) => ({ad, tutar, oran: tutar/top}))
    .sort((a,b)=>b.tutar-a.tutar);
}

/* modal form ------------------------------------------------------- */
function kapat(){ $$('.kapla').forEach(e=>e.remove()); }
function formAc({baslik, alanlar, deger={}, kaydet, genis=false, sil=null, ekAlt='', dogrula=null}){
  kapat();
  const d = document.createElement('div');
  d.className = 'kapla';
  const govde = alanlar.map(a => alanCiz(a, deger[a.ad])).join('');
  d.innerHTML = `<div class="kutu ${genis?'genis':''}">
    <h3>${kacir(baslik)}</h3>
    <form id="frm">${govde}${ekAlt}
      <div class="dugmeler">
        ${sil ? '<button type="button" class="btn tehlike" id="sil">Sil</button>' : ''}
        <div style="flex:1"></div>
        <button type="button" class="btn ikincil" id="vazgec">Vazgeç</button>
        <button type="submit" class="btn">Kaydet</button>
      </div>
    </form></div>`;
  document.body.appendChild(d);
  d.addEventListener('click', e => { if(e.target === d) kapat(); });
  $('#vazgec', d).onclick = kapat;
  if(sil) $('#sil', d).onclick = () => { if(confirm('Silinsin mi?')){ sil(); kapat(); ciz(); } };
  $('#frm', d).onsubmit = ev => {
    ev.preventDefault();
    const v = {};
    alanlar.forEach(a => {
      const el = d.querySelector(`[name="${a.ad}"]`);
      if(!el) return;
      v[a.ad] = a.tip === 'onay' ? el.checked : (a.tip === 'sayi' ? say(el.value) : el.value);
    });
    if(dogrula){
      const hata = dogrula(v);
      if(hata){
        let e = $('#frmHata', d);
        if(!e){
          e = document.createElement('p');
          e.id = 'frmHata';
          e.style.cssText = 'margin-top:10px;font-size:13px;color:var(--kirmiziY)';
          $('#frm', d).appendChild(e);
        }
        e.textContent = hata;
        return;
      }
    }
    kaydet(v);
    kapat(); ciz();
  };
  d.addEventListener('click', ev => {
    const sc = ev.target.closest('[data-sembolsec]');
    if(sc){
      ev.preventDefault();
      const alan = d.querySelector('[name="sembol"]');
      if(alan){
        alan.value = sc.dataset.sembolsec;
        const p = pozisyonHesapla(alan.value);
        const tAlan = d.querySelector('[name="tur"]');
        if(tAlan && p.tur) tAlan.value = p.tur;
        const adAlan = d.querySelector('[name="ad"]');
        if(adAlan && p.ad && !adAlan.value) adAlan.value = p.ad;
        kosulluAlanlar(d, []);
      }
      return;
    }
    const c = ev.target.closest('[data-etiket]');
    if(!c) return;
    ev.preventDefault();
    const alan = d.querySelector('[name="etiketMetin"]');
    if(!alan) return;
    const mevcutlar = alan.value.split(',').map(x => x.trim()).filter(Boolean);
    const e = c.dataset.etiket;
    const ix = mevcutlar.indexOf(e);
    if(ix > -1) mevcutlar.splice(ix, 1); else mevcutlar.push(e);
    alan.value = mevcutlar.join(', ');
    etiketleriIsaretle(d);
  });
  etiketleriIsaretle(d);
  secenekTazele(d, alanlar);
  const ilk = d.querySelector('input,select,textarea'); if(ilk) ilk.focus();
  // koşullu alanlar
  d.addEventListener('change', () => { kosulluAlanlar(d, alanlar); secenekTazele(d, alanlar); });
  d.addEventListener('input', () => { kosulluAlanlar(d, alanlar); etiketleriIsaretle(d); });
  kosulluAlanlar(d, alanlar);
}
function etiketleriIsaretle(d){
  const alan = d.querySelector('[name="etiketMetin"]');
  if(!alan) return;
  const secili = alan.value.split(',').map(x => x.trim().toLocaleLowerCase('tr')).filter(Boolean);
  $$('[data-etiket]', d).forEach(c =>
    c.classList.toggle('secili', secili.includes(c.dataset.etiket.toLocaleLowerCase('tr'))));
}

/* Seçenekleri başka bir alana bağlı olan açılır listeleri tazeler */
function secenekTazele(d, alanlar){
  const degerler = {};
  alanlar.forEach(x => {
    const el = d.querySelector(`[name="${x.ad}"]`);
    if(el) degerler[x.ad] = x.tip === 'onay' ? el.checked : el.value;
  });
  alanlar.forEach(a => {
    if(!a.bagli) return;
    const el = d.querySelector(`[name="${a.ad}"]`);
    if(!el || el.tagName !== 'SELECT') return;
    const yeni = a.bagli(degerler);
    const imza = yeni.map(o => o.v).join('|');
    if(el.dataset.imza === imza) return;
    const secili = el.value;
    el.innerHTML = yeni.map(o =>
      `<option value="${kacir(o.v)}">${kacir(o.a)}</option>`).join('');
    el.dataset.imza = imza;
    if(yeni.some(o => String(o.v) === secili)) el.value = secili;
  });
}

function kosulluAlanlar(d, alanlar){
  alanlar.forEach(a => {
    if(!a.gorunur) return;
    const kutu = d.querySelector(`[data-alan="${a.ad}"]`);
    if(!kutu) return;
    const degerler = {};
    alanlar.forEach(x => {
      const el = d.querySelector(`[name="${x.ad}"]`);
      if(el) degerler[x.ad] = x.tip === 'onay' ? el.checked : el.value;
    });
    kutu.classList.toggle('gizli', !a.gorunur(degerler));
  });
}
function alanCiz(a, v){
  const ad = a.ad, et = a.etiket || '';
  let ic = '';
  if(a.tip === 'secim'){
    ic = `<select name="${ad}">${(typeof a.secenekler==='function'?a.secenekler():a.secenekler)
      .map(o => `<option value="${kacir(o.v)}" ${String(o.v)===String(v??a.on??'')?'selected':''}>${kacir(o.a)}</option>`).join('')}</select>`;
  } else if(a.tip === 'onay'){
    return `<div class="alan" data-alan="${ad}"><label style="display:flex;gap:8px;align-items:center;cursor:pointer">
      <input type="checkbox" name="${ad}" ${ (v??a.on) ? 'checked':''} style="width:auto">${kacir(et)}</label></div>`;
  } else if(a.tip === 'etiket'){
    const liste = (typeof a.secenekler === 'function' ? a.secenekler() : (a.secenekler||[]));
    ic = `<input type="text" name="${ad}" value="${kacir(v??'')}" placeholder="${kacir(a.ipucu||'')}">`
      + (liste.length ? `<div class="etiketler">${liste.map(e =>
          `<button type="button" class="eticip" data-etiket="${kacir(e)}">#${kacir(e)}</button>`).join('')}</div>` : '');
  } else if(a.tip === 'metinKutu'){
    ic = `<textarea name="${ad}" rows="${a.satir||4}" placeholder="${kacir(a.ipucu||'')}">${kacir(v??a.on??'')}</textarea>`;
  } else {
    const tip = a.tip === 'sayi' ? 'number' : (a.tip === 'tarih' ? 'date' : 'text');
    const adim = a.tip === 'sayi' ? 'step="any"' : '';
    ic = `<input type="${tip}" name="${ad}" ${adim} value="${kacir(v??a.on??'')}" placeholder="${kacir(a.ipucu||'')}">`;
  }
  return `<div class="alan" data-alan="${ad}"><label>${kacir(et)}</label>${ic}</div>`;
}
function hesapSec(filtre){
  return () => (D.hesaplar||[]).filter(h => !bool(h.arsiv) && (!filtre || filtre(h)))
    .map(h => ({v:h.id, a:h.ad}));
}
function kategoriSec(yon){
  return () => {
    const cikti = [];
    anaKategoriler(yon).forEach(k => {
      cikti.push({v:k.id, a:k.ad});
      (D.kategoriler||[]).filter(x => x.parentId === k.id && !bool(x.arsiv))
        .forEach(x => cikti.push({v:x.id, a:'   ' + k.ad + ' › ' + x.ad}));
    });
    return cikti;
  };
}

function gorunumIslemler(){

  if(fltr.tur !== 'hepsi') liste = liste.filter(i => i.tur === fltr.tur);
  if(fltr.hesap) liste = liste.filter(i => i.hesapId === fltr.hesap || i.hedefHesapId === fltr.hesap);
  if(fltr.etiket) liste = liste.filter(i => (i.etiketler||[]).includes(fltr.etiket));
  liste.sort((a,b)=> a.tarih < b.tarih ? 1 : -1);
  const gider = liste.filter(i=>i.tur==='gider').reduce((a,i)=>a+say(i.tryTutar),0);
  const gelir = liste.filter(i=>i.tur==='gelir').reduce((a,i)=>a+say(i.tryTutar),0);
  const etiketler = [...new Set((D.islemler||[]).flatMap(i=>i.etiketler||[]))];
  const gruplar = {};

  <div class="ust"><h1>İşlemler</h1>${aySecici(donem)}

    ${etiketler.map(e=>`<button data-eylem="fltrEtiket" data-v="${kacir(e)}" class="${fltr.etiket===e?'on':''}">#${kacir(e)}</button>`).join('')}

function gorunumButce(){

      ${ayAdi(fltr.ay)} planlanan tasarruf
      <b class="sayi ${t.planlanan<0?'eks':'art'}" style="margin-left:6px">${para(t.planlanan)}</b>
      ${fltr.ay === d ? `· gerçekleşen <b class="sayi ${t.gerceklesen<0?'eks':'art'}">${para(t.gerceklesen)}</b>` : ''}
    </span>
  </div>`;
}

function gorunumGiderButce(){
  const aylar = [fltr.ay, ayEkle(fltr.ay, 1), ayEkle(fltr.ay, 2)];
  const ozetler = aylar.map(a => ({donem:a, o:butceOzet(a)}));
  const kats = anaKategoriler('gider').filter(k =>
    aylar.some(a => butceSatir(k.id, a) > 0 || kategoriHarcama(k.id, a) > 0 || devir(k.id, a) !== 0));
  const buAy = donemStr(bugun());

  const kartlar = ozetler.map(({donem, o}) => {
    const oran = o.toplamLimit ? o.toplamHarcanan / o.toplamLimit : 0;
    const simdi = donem === buAy;
    if(!o.toplamLimit && !o.toplamHarcanan){
      return `<div class="bay">
        <div class="baybas"><b>${ayAdi(donem)}</b></div>
        <div class="bos" style="padding:14px 0">Limit tanımlı değil</div>
        <button class="btn ikincil ince" data-eylem="butceDuzenle" data-donem="${donem}">Limit belirle</button>
      </div>`;
    }
    return `<div class="bay${simdi?' simdi':''}">
      <div class="baybas"><b>${ayAdi(donem)}</b>${simdi?'<span class="rozet">bu ay</span>':''}</div>
      <p class="etk" style="margin-top:6px">Kalan</p>
      <p class="orta sayi">${para(o.kalan)}</p>
      ${izgara(oran, oran > 1 ? 'k' : (oran > 0.85 ? 's' : ''))}
      <table style="margin-top:8px">
        <tr><td class="etk">Ayın bütçesi</td><td class="sag sayi">${para(o.toplamSade)}</td></tr>
        ${o.toplamDevir ? `<tr><td class="etk">Devir</td>
          <td class="sag sayi ${o.toplamDevir<0?'eks':''}">${para(o.toplamDevir)}</td></tr>
          <tr><td class="etk">Kullanılabilir</td><td class="sag sayi">${para(o.toplamLimit)}</td></tr>` : ''}
        <tr><td class="etk">Harcanan</td><td class="sag sayi">${para(o.toplamHarcanan)}</td></tr>
        ${simdi ? `<tr><td class="etk">Günlük harcanabilir</td><td class="sag sayi">${para(o.gunluk)}</td></tr>
          <tr><td class="etk">Ay sonu tahmini</td><td class="sag sayi">${para(o.aySonuTahmin)}</td></tr>` : ''}
      </table>
    </div>`;
  }).join('');

  const satirlar = kats.map(k => {
    const hucreler = aylar.map(a => {
      const limit = butceSatir(k.id, a);
      const dvr = devir(k.id, a);
      const etkin = limit + dvr;
      const harcanan = kategoriHarcama(k.id, a);
      const oran = etkin ? harcanan / etkin : (harcanan ? 1 : 0);
      const sinif = oran > 1 ? 'k' : (oran > 0.85 ? 's' : '');
      return `<div class="bhucre" data-eylem="limitAc" data-id="${k.id}" data-donem="${a}">
        <div class="bsatir"><b class="sayi">${para(harcanan)}</b>
          <span class="etk sayi">${limit ? '/ ' + para(limit) : (etkin ? '/ 0' : '—')}</span></div>
        ${etkin ? izgara(oran, sinif) : '<div class="iz" style="opacity:.35"></div>'}
        <div class="bdevir">${dvr ? 'devir ' + para(dvr) + ' · toplam ' + para(etkin) : ''}</div>
      </div>`;
    }).join('');
    return `<div class="bkat">${kacir(k.ad)}</div>${hucreler}`;
  }).join('');

  const toplamlar = ozetler.map(({o}) => `<div class="bhucre btoplam">
    <div class="bsatir"><b class="sayi">${para(o.toplamHarcanan)}</b>
      <span class="etk sayi">/ ${para(o.toplamSade)}</span></div>
    <div class="bdevir">${o.toplamDevir ? 'devirle ' + para(o.toplamLimit) : ''}</div>
  </div>`).join('');

  return `
  <div class="ust"><h1>Bütçe</h1>${aySecici(fltr.ay)}
    <button class="btn ikincil" data-eylem="butceDisaAktar">Excel'e aktar</button>
    <button class="btn ikincil" data-eylem="butceIceAktar">Excel'den yükle</button>
    <button class="btn ikincil" data-eylem="butceKopyala">Geçen aydan kopyala</button>
    <button class="btn" data-eylem="butceDuzenle"><svg><use href="#s-plus"/></svg>Limit belirle</button></div>
  ${butceSekmeleri()}
  <div class="bkaydir">
    <div class="butceIzgara">
      <div></div>${kartlar}
      ${kats.length ? `<div class="bbaslik">Kategori</div>
        ${aylar.map(a => `<div class="bbaslik">${ayAdi(a)}</div>`).join('')}
        ${satirlar}
        <div class="bkat btoplam">Toplam</div>${toplamlar}`
        : `<div class="bkat">—</div>
           <div class="bhucre" style="grid-column:span 3">${bosKutu('Bu dönemde limit ya da harcama yok.')}</div>`}
    </div>
  </div>
  <p class="etk" style="margin-top:12px">Bir hücreye tıklayarak o kategorinin o aya ait limitini
  değiştirebilirsin. Oklar pencereyi birer ay kaydırır.</p>`;
}

function gorunumGelirButce(){
  const aylar = [fltr.ay, ayEkle(fltr.ay, 1), ayEkle(fltr.ay, 2)];
  const ozetler = aylar.map(a => ({donem:a, o:gelirOzet(a)}));
  const kats = anaKategoriler('gelir').filter(k =>
    aylar.some(a => butceSatir(k.id, a) > 0 || kategoriGelir(k.id, a) > 0));
  const buAy = donemStr(bugun());

  const kartlar = ozetler.map(({donem, o}) => {
    const oran = o.toplamPlan ? o.toplamGercek / o.toplamPlan : 0;
    const simdi = donem === buAy;
    const gelecek = donem > buAy;
    if(!o.toplamPlan && !o.toplamGercek){
      return `<div class="bay">
        <div class="baybas"><b>${ayAdi(donem)}</b></div>
        <div class="bos" style="padding:14px 0">Gelir planı yok</div>
        <button class="btn ikincil ince" data-eylem="butceDuzenle" data-donem="${donem}">Gelir planla</button>
      </div>`;
    }
    return `<div class="bay${simdi?' simdi':''}">
      <div class="baybas"><b>${ayAdi(donem)}</b>${simdi?'<span class="rozet">bu ay</span>':''}</div>
      <p class="etk" style="margin-top:6px">Gerçekleşen gelir</p>
      <p class="orta sayi">${para(o.toplamGercek)}</p>
      ${izgara(Math.min(1, oran))}
      <table style="margin-top:8px">
        <tr><td class="etk">Planlanan</td><td class="sag sayi">${para(o.toplamPlan)}</td></tr>
        ${gelecek ? '' : `<tr><td class="etk">Bekleyen</td><td class="sag sayi">${para(o.bekleyen)}</td></tr>
        <tr><td class="etk">Fark</td>
          <td class="sag sayi ${o.fark<0?'eks':'art'}">${o.fark>0?'+':''}${para(o.fark)}</td></tr>`}
        ${simdi ? `<tr><td class="etk">Ay sonu tahmini</td><td class="sag sayi">${para(o.aySonuTahmin)}</td></tr>` : ''}
      </table>
    </div>`;
  }).join('');

  const satirlar = kats.map(k => {
    const hucreler = aylar.map(a => {
      const plan = butceSatir(k.id, a);
      const gercek = kategoriGelir(k.id, a);
      const oran = plan ? gercek / plan : (gercek ? 1 : 0);
      const fark = a > buAy ? 0 : gercek - plan;
      return `<div class="bhucre" data-eylem="limitAc" data-id="${k.id}" data-donem="${a}">
        <div class="bsatir"><b class="sayi">${para(gercek)}</b>
          <span class="etk sayi">${plan ? '/ ' + para(plan) : '—'}</span></div>
        ${plan || gercek ? izgara(Math.min(1, oran)) : '<div class="iz" style="opacity:.35"></div>'}
        <div class="bdevir">${plan && fark ? (fark > 0 ? 'fazla ' : 'eksik ') + para(Math.abs(fark)) : ''}</div>
      </div>`;
    }).join('');
    return `<div class="bkat">${kacir(k.ad)}</div>${hucreler}`;
  }).join('');

  const toplamlar = ozetler.map(({donem, o}) => {
    const f = donem > buAy ? 0 : o.fark;
    return `<div class="bhucre btoplam">
