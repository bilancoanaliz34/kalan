/* Sembol ya da ad araması. Aramada Türkçe harfler sadeleştirilir: "i" ile
   "ı", "s" ile "ş" aynı sayılır. Böylece INVEO'yu ararken "inveo" yazmak
   yetiyor — klavyede noktasız ı'ya geçmek gerekmiyor. */
const ARA_HARF = {'İ':'i','I':'i','ı':'i','Ş':'s','ş':'s','Ğ':'g','ğ':'g',
  'Ü':'u','ü':'u','Ö':'o','ö':'o','Ç':'c','ç':'c','Â':'a','â':'a','Î':'i','î':'i','Û':'u','û':'u'};
function kucult(s){
  return String(s||'').replace(/[İIıŞşĞğÜüÖöÇçÂâÎîÛû]/g, c => ARA_HARF[c]).toLowerCase();
}
function araUyar(sembol, ad){
  const q = kucult(yatAra).trim();
  if(!q) return true;
  return kucult(sembol).includes(q) || kucult(ad).includes(q);
}

/* Bir sembolün adını işlem kayıtlarından ya da pozisyon listesinden bulur */
function sembolAdi(sembol){
  const t = (D.trades||[]).find(x =>
    kucult(x.sembol) === kucult(sembol) && x.ad);
  if(t) return t.ad;
  const f = (D.fiyatlar||[]).find(x => kucult(x.sembol) === kucult(sembol) && x.ad);
  return f ? f.ad : '';
}

/* Metinler Türkçe alfabeye göre, sayılar büyüklüğe göre sıralanır */
function sirala(dizi, alan, yon){
  return dizi.slice().sort((a, b) => {
    const x = a[alan], y = b[alan];
    const metin = typeof x === 'string' || typeof y === 'string';
    if(metin) return String(x||'').localeCompare(String(y||''), 'tr') * yon;
    return (say(x) - say(y)) * yon;
  });
}
function siraBaslik(durum, etiket, alan, sag){
  const aktif = durum.alan === alan;
  return `<th class="${sag ? 'sag ' : ''}siralanir${aktif ? ' aktif' : ''}"
    data-eylem="${durum === yatSira ? 'yatSirala' : 'tradeSirala'}" data-alan="${alan}"
    title="Sıralamak için tıkla">${kacir(etiket)}<i>${aktif ? (durum.yon < 0 ? '↓' : '↑') : ''}</i></th>`;
}

function yuzde(o){
  const v = (say(o) * 100);
  return (v > 0 ? '+' : '') + v.toFixed(1).replace('.', ',') + '%';
}

function pozisyonTablosu(t){
  // Kapanmış pozisyonlardaki fazla satış uyarısı tablo boşken de görünmeli
  const fazla = t.pozisyonlar.filter(p => p.fazlaSatis > 0 && araUyar(p.sembol, p.ad));
  const fazlaKutu = fazla.length ? `<p class="uyari" style="margin-top:10px">
      <b>${fazla.map(p => kacir(p.sembol) + ' (' +
        say(p.fazlaSatis).toLocaleString('tr-TR',{maximumFractionDigits:4}) + ' adet)').join(', ')}</b>
      için satışlar elindekinden fazla görünüyor. Fazla satılan kısım hesaba katılmadı —
      büyük ihtimalle bir alış kaydı eksik ya da tarihi yanlış girilmiş.</p>` : '';

  if(!t.acik.length) return `<div class="kart">${bosKutu(
    'Açık pozisyon yok. Sağ üstten bir alış işlemi ekleyerek başlayabilirsin.')}${fazlaKutu}</div>`;
  const acik = t.acik.filter(p => araUyar(p.sembol, p.ad));
  if(!acik.length) return `<div class="kart"><p class="arabos">
    “${kacir(yatAra)}” ile eşleşen pozisyon yok.</p>${fazlaKutu}</div>`;
  return `<div class="kart"><div class="bkaydir"><table style="min-width:900px">
    <tr>${siraBaslik(yatSira,'Sembol','sembol')}${siraBaslik(yatSira,'Adet','adet',1)}
      ${siraBaslik(yatSira,'Maliyet','birim',1)}${siraBaslik(yatSira,'Temettü','temettuTl',1)}
      ${siraBaslik(yatSira,'Fiyat','fiyat',1)}${siraBaslik(yatSira,'Değer','deger',1)}
      ${siraBaslik(yatSira,'K/Z (TL)','acikKzTl',1)}${siraBaslik(yatSira,'K/Z (USD)','acikKzUsd',1)}<th></th></tr>
    ${sirala(acik, yatSira.alan, yatSira.yon).map(p => `<tr${p.fiyat>0?'':' style="opacity:.6"'}>
      <td><b>${kacir(p.sembol)}</b>
        <span class="rozet n" style="margin-left:6px">${p.tur==='fon'?'Fon':'Hisse'}</span>
        ${p.fazlaSatis > 0 ? `<span class="rozet s" style="margin-left:4px"
          title="Satışlar elde olandan ${say(p.fazlaSatis).toLocaleString('tr-TR',{maximumFractionDigits:4})} adet fazla. Eksik bir alış kaydı olabilir.">kayıt eksik</span>` : ''}
        ${p.ad?`<br><small class="etk">${kacir(p.ad)}</small>`:''}</td>
      <td class="sag sayi">${say(p.adet).toLocaleString('tr-TR',{maximumFractionDigits:4})}</td>
      <td class="sag sayi">${para(p.birim,'TRY',p.tur==='fon'?4:2)}
        <div class="etk" style="font-size:11.5px">${para(p.birimUsd,'USD',p.tur==='fon'?4:2)}</div></td>
      <td class="sag sayi ${p.temettuTl>0?'art':'etk'}">${p.temettuTl>0
        ? para(p.temettuTl) + `<div class="etk" style="font-size:11.5px">${para(p.temettuUsd,'USD')}</div>` : '—'}</td>
      <td class="sag sayi">${p.fiyat>0 ? para(p.fiyat,'TRY',p.tur==='fon'?4:2)
        : '<span class="rozet s">fiyat yok</span>'}</td>
      <td class="sag sayi">${p.fiyat>0 ? para(p.deger) +
        `<div class="etk" style="font-size:11.5px">${para(p.degerUsd,'USD')}</div>` : '<span class="etk">—</span>'}</td>
      <td class="sag sayi ${p.fiyat>0 ? (p.acikKzTl<0?'eks':'art') : 'etk'}">${p.fiyat>0
        ? (p.acikKzTl>0?'+':'') + para(p.acikKzTl) +
          `<div style="font-size:11.5px;font-weight:500">${yuzde(p.acikOran)}</div>` : '—'}</td>
      <td class="sag sayi ${p.fiyat>0 ? (p.acikKzUsd<0?'eks':'art') : 'etk'}">${p.fiyat>0
        ? (p.acikKzUsd>0?'+':'') + para(p.acikKzUsd,'USD') +
          `<div style="font-size:11.5px;font-weight:500">${yuzde(p.acikOranUsd)}</div>` : '—'}</td>
      <td class="sag" style="white-space:nowrap">
        <button class="btn ikincil ince" data-eylem="tradeEkle" data-sembol="${kacir(p.sembol)}" data-yon="alis">Al</button>
        <button class="btn ikincil ince" data-eylem="tradeEkle" data-sembol="${kacir(p.sembol)}" data-yon="satis">Sat</button></td>
    </tr>`).join('')}
    ${(() => {
      // Arama varsa toplam da yalnızca görünen satırları kapsar
      const g = acik.filter(p => p.fiyat > 0);
      const topla = (alan) => g.reduce((a,p) => a + say(p[alan]), 0);
      const mal = topla('maliyet'), deg = topla('deger');
      const kzTl = deg - mal, kzUsd = topla('degerUsd') - topla('maliyetUsd');
      const tem = acik.reduce((a,p) => a + say(p.temettuTl), 0);
      return `<tr style="border-top:2px solid var(--cizgi)">
      <td><b>Toplam</b>${yatAra ? `<br><small class="etk">${acik.length} kayıt · arama sonucu</small>` : ''}</td>
      <td></td><td class="sag sayi">${para(mal)}</td>
      <td class="sag sayi ${tem>0?'art':''}">${tem>0?para(tem):''}</td><td></td>
      <td class="sag sayi"><b>${para(deg)}</b></td>
      <td class="sag sayi ${kzTl<0?'eks':'art'}"><b>${kzTl>0?'+':''}${para(kzTl)}</b></td>
      <td class="sag sayi ${kzUsd<0?'eks':'art'}"><b>${kzUsd>0?'+':''}${para(kzUsd,'USD')}</b></td>
      <td></td></tr>`;
    })()}
  </table></div>
  ${fazlaKutu}
  ${t.fiyatsiz.filter(p => araUyar(p.sembol, p.ad)).length ? `<p class="etk" style="margin-top:10px">
    ${t.fiyatsiz.filter(p => araUyar(p.sembol, p.ad)).map(p => kacir(p.sembol)).join(', ')} için fiyat yok, bu yüzden toplamlara
    katılmadı. “Fiyatları güncelle” ile çekebilir ya da Ayarlar'dan elle girebilirsin.</p>` : ''}</div>`;
}

function tradeGecmisi(){
  let liste = (D.trades||[]).slice();
  if(yatFiltre !== 'hepsi') liste = liste.filter(x => (x.tur||'hisse') === yatFiltre);
  if(kucult(yatAra).trim())
    liste = liste.filter(x => araUyar(x.sembol, x.ad || sembolAdi(x.sembol)));
  if(tradeSira.alan === 'tarih')
    liste.sort((a,b) => a.tarih === b.tarih
      ? (a.id < b.id ? -tradeSira.yon : tradeSira.yon)
      : (a.tarih < b.tarih ? -tradeSira.yon : tradeSira.yon));
  else liste = sirala(liste, tradeSira.alan, tradeSira.yon);
  if(!liste.length) return `<div class="kart">${yatAra
    ? `<p class="arabos">“${kacir(yatAra)}” ile eşleşen işlem yok.</p>`
    : bosKutu('Kayıtlı işlem yok.')}</div>`;
  return `<div class="kart"><div class="bkaydir"><table style="min-width:760px">
    <tr>${siraBaslik(tradeSira,'Tarih','tarih')}${siraBaslik(tradeSira,'Sembol','sembol')}
      ${siraBaslik(tradeSira,'İşlem','yon')}${siraBaslik(tradeSira,'Adet','adet',1)}
      ${siraBaslik(tradeSira,'Fiyat','fiyat',1)}<th class="sag">Tutar</th>
      ${siraBaslik(tradeSira,'Kur','usdKuru',1)}<th></th></tr>
    ${liste.map(x => {
      const a = say(x.adet), f = say(x.fiyat), k = tradeKur(x);
      const tutar = x.yon === 'temettu' ? f : a * f;
      const ozel = x.yon === 'bedelsiz' || x.yon === 'bolunme';
      return `<tr data-eylem="tradeAc" data-id="${x.id}" style="cursor:pointer">
        <td>${trTarih(x.tarih)}</td>
        <td><b>${kacir(x.sembol)}</b></td>
        <td><span class="rozet ${x.yon==='satis'?'k':(x.yon==='alis'?'':'n')}">${TRADE_YON[x.yon]||x.yon}</span>
          ${x.not?`<br><small class="etk">${kacir(x.not)}</small>`:''}</td>
        <td class="sag sayi">${ozel ? '<span class="etk">oran ' + say(x.oran).toLocaleString('tr-TR') + '</span>'
          : (a ? a.toLocaleString('tr-TR',{maximumFractionDigits:4}) : '')}</td>
        <td class="sag sayi">${ozel ? '' : (x.yon==='temettu' ? '' : para(f,'TRY',x.tur==='fon'?4:2))}</td>
        <td class="sag sayi ${x.yon==='satis'||x.yon==='temettu'?'art':''}">${ozel ? '' :
          (x.yon==='alis'?'−':'+') + para(tutar)}
          ${ozel ? '' : `<div class="etk" style="font-size:11.5px">${para(tutar/k,'USD')}</div>`}</td>
        <td class="sag sayi etk">${k>1?para(k,'TRY',2):''}</td>
        <td class="sag"><span class="etk">düzenle ›</span></td>
      </tr>`;
    }).join('')}
  </table></div></div>`;
}

function kapananTablosu(t){
  if(!t.kapanan.length) return `<div class="kart">${bosKutu(
    'Henüz kapanmış işlem yok. Bir satış girdiğinde gerçekleşen kâr/zarar burada listelenir.')}</div>`;
  const kapanan = t.kapanan.filter(k => araUyar(k.sembol, k.ad));
  if(!kapanan.length) return `<div class="kart"><p class="arabos">
    “${kacir(yatAra)}” ile eşleşen kapanmış işlem yok.</p></div>`;
  const yillar = {};
  kapanan.forEach(k => {
    const y = String(k.tarih).slice(0,4);
    (yillar[y] = yillar[y] || []).push(k);
  });
  return Object.keys(yillar).sort().reverse().map(y => {
    const satirlar = yillar[y];
    const tl = satirlar.reduce((a,k) => a + k.kzTl, 0);
    const usd = satirlar.reduce((a,k) => a + k.kzUsd, 0);
    return `<div class="kart" style="margin-bottom:16px">
      <div class="bas"><span>${y}</span>
        <span class="etk">${satirlar.length} kapanış</span>
        <span class="sayi ${tl<0?'eks':'art'}" style="font-weight:600">${tl>0?'+':''}${para(tl)}</span>
        <span class="sayi etk">${usd>0?'+':''}${para(usd,'USD')}</span></div>
      <div class="bkaydir"><table style="min-width:720px">
        <tr><th>Tarih</th><th>Sembol</th><th class="sag">Adet</th>
          <th class="sag">Maliyet</th><th class="sag">Satış</th>
          <th class="sag">K/Z (TL)</th><th class="sag">K/Z (USD)</th></tr>
        ${satirlar.map(k => `<tr>
          <td>${trTarih(k.tarih)}</td>
          <td><b>${kacir(k.sembol)}</b></td>
          <td class="sag sayi">${say(k.adet).toLocaleString('tr-TR',{maximumFractionDigits:4})}</td>
          <td class="sag sayi">${para(k.maliyet,'TRY',k.tur==='fon'?4:2)}</td>
          <td class="sag sayi">${para(k.fiyat,'TRY',k.tur==='fon'?4:2)}</td>
          <td class="sag sayi ${k.kzTl<0?'eks':'art'}">${k.kzTl>0?'+':''}${para(k.kzTl)}
            <div style="font-size:11.5px;font-weight:500">${yuzde(k.oran)}</div></td>
          <td class="sag sayi ${k.kzUsd<0?'eks':'art'}">${k.kzUsd>0?'+':''}${para(k.kzUsd,'USD')}
            <div style="font-size:11.5px;font-weight:500">${yuzde(k.oranUsd)}</div></td>
        </tr>`).join('')}
      </table></div></div>`;
  }).join('');
}

function gorunumEmirler(){
  const liste = emirListesi();
  const g = genelKural();
  const tetik = liste.filter(d => d.alisTetik || d.satisTetik);
  const yzd = o => (say(o) * 100).toFixed(1).replace('.', ',') + '%';

  /* Bir sütunun kartı. yon = alis | satis
     Eşiğe ulaşanlar dolgulu, yolda olanlar sade gösterilir. */
  const emirKarti = (d, yon) => {
    const alisMi = yon === 'alis';
    const tetik = alisMi ? d.alisTetik : d.satisTetik;
    const esik  = alisMi ? d.alisEsik : d.satisEsik;
    const git   = alisMi ? d.dusus : d.artis;       // kat edilen oran
    const oran  = alisMi ? d.alisOran : d.satisOran;
    const hedef = alisMi ? d.alisHedef : d.satisHedef;
    const adet  = alisMi ? d.alisAdet : d.satisAdet;
    const tutar = alisMi ? d.alisTutar : d.satisTutarTl;
    const bas   = d.tur === 'fon' ? 4 : 2;
    const kalan = Math.max(0, esik - git);
    return `<div class="emirk ${yon}${tetik ? ' tetik' : ''}">
      <div class="emirb">
        <b>${kacir(d.sembol)}</b>
        ${d.ad ? `<span class="etk" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${kacir(d.ad)}</span>` : '<span style="flex:1"></span>'}
        <span class="rozet ${tetik ? (alisMi ? '' : 'k') : 'n'}">${
          tetik ? (alisMi ? '−' : '+') + yzd(Math.abs(git)) : '%' + (say(kalan)*100).toFixed(1).replace('.',',') + ' kaldı'}</span>
      </div>
      <div class="emircubuk" title="Eşiğin %${(oran*100).toFixed(0)}'i kat edildi"><i style="width:${(oran*100).toFixed(1)}%"></i></div>
      <div class="emirsat">
        <span>Son işlem <b>${para(d.referans,'TRY',bas)}</b></span>
        <span>Güncel <b>${para(d.guncel,'TRY',bas)}</b></span>
        <span>Hedef <b>${para(hedef,'TRY',bas)}</b></span>
      </div>
      ${tetik ? `<div class="emirsin">
        <span><b>${say(adet).toLocaleString('tr-TR')} adet</b> ${alisMi ? 'al' : 'sat'} · ${para(tutar)}</span>
        ${!alisMi && d.satisKisitli ? '<span class="etk">elindeki kadar</span>' : ''}
      </div>` : ''}
    </div>`;
  };

  /* Sütun. Sıralama kullanıcının seçimine göre; varsayılan eşiğe yakınlık. */
  const sutun = (yon) => {
    const alisMi = yon === 'alis';
    const s = alisMi ? emirAlisSira : emirSatisSira;
    const oranAl = d => say(alisMi ? d.alisOran : d.satisOran);
    const gitAl  = d => say(alisMi ? d.dusus : d.artis);
    const tutarAl = d => say(alisMi ? d.alisTutar : d.satisTutarTl);

    const sirali = liste
      .filter(d => d.hazir && (alisMi ? d.alisAralikta : d.satisAralikta))
      .sort((a,b) => {
        if(s === 'sembol') return a.sembol.localeCompare(b.sembol, 'tr');
        if(s === 'degisim') return gitAl(b) - gitAl(a);
        if(s === 'tutar')   return tutarAl(b) - tutarAl(a);
        if(s === 'fiyat')   return say(b.guncel) - say(a.guncel);
        return (oranAl(b) - oranAl(a)) || (gitAl(b) - gitAl(a));   // yakin
      });
    const tetikSayi = sirali.filter(d => alisMi ? d.alisTetik : d.satisTetik).length;
    const eylem = alisMi ? 'emirAlisSirala' : 'emirSatisSirala';

    return `<div>
      <div class="bas" style="margin:0 0 8px">
        <span>${alisMi ? 'Alış emirleri' : 'Satış emirleri'}</span>
        ${tetikSayi ? `<span class="rozet ${alisMi?'':'k'}">${tetikSayi} tetiklendi</span>` : ''}
        <span class="etk">${sirali.length} sembol</span>
      </div>
      <div class="sirasec">
        <span class="etk">Sırala</span>
        ${[['yakin','Eşiğe yakınlık'],['degisim', alisMi?'Düşüş':'Artış'],
           ['sembol','Sembol'],['fiyat','Fiyat'],['tutar','Tutar']].map(([v,a]) =>
          `<button data-eylem="${eylem}" data-v="${v}" class="${s===v?'on':''}">${a}</button>`).join('')}
      </div>
      ${sirali.length ? sirali.map(d => emirKarti(d, yon)).join('')
        : `<div class="kart">${bosKutu(alisMi
          ? 'Fiyatı son işleminin altına inen sembol yok.'
          : 'Fiyatı son işleminin üstüne çıkan, elinde duran sembol yok.')}</div>`}
    </div>`;
  };

  return `
  <div class="ust"><h1>Emirler</h1>
    <button class="btn ikincil" data-eylem="fiyatYenile"><svg><use href="#s-sync"/></svg>Fiyatları güncelle</button>
    <button class="btn ikincil" data-eylem="kuralDuzenle" data-sembol="*">Genel kural</button>
    <button class="btn" data-eylem="kuralDuzenle"><svg><use href="#s-plus"/></svg>Hisse kuralı</button></div>

  <div class="kart" style="margin-bottom:16px">
    <div class="bas"><span>Genel kural</span>
      <span class="etk">kendi kuralı olmayan tüm semboller için geçerli</span></div>
    ${(g.alisTutar || g.satisTutar) ? `<div class="izgara i3">
      <div><p class="etk">Alış</p><p class="orta sayi">${para(g.alisTutar)}</p>
        <p class="etk">%${(say(g.alisDusus)*100).toFixed(1).replace('.',',')} düşüşte</p></div>
      <div><p class="etk">Satış</p><p class="orta sayi">${para(g.satisTutar)}</p>
        <p class="etk">%${(say(g.satisArtis)*100).toFixed(1).replace('.',',')} artışta</p></div>
      <div><p class="etk">Referans</p><p class="orta" style="font-size:15px">Son işlem fiyatı</p>
        <p class="etk">her sembolün kendi son alım/satımı</p></div>
    </div>` : bosKutu('Genel kural tanımlı değil. “Genel kural” ile tutar ve oranları belirle.')}
  </div>

  <div class="ikili">${sutun('alis')}${sutun('satis')}</div>

  <div class="kart" style="margin-top:16px">
    <div class="bas"><span>Tüm semboller</span>
      <span class="etk">${liste.length} sembol${tetik.length
        ? ' · ' + tetik.length + ' tanesi tetiklendi' : ''}</span></div>
    ${liste.length ? `<div class="bkaydir"><table style="min-width:880px">
      <tr><th class="siralanir${emirSira==='sembol'?' aktif':''}" data-eylem="emirSirala" data-v="sembol"
          title="Sıralamak için tıkla">Sembol<i>${emirSira==='sembol'?'↑':''}</i></th>
        <th class="sag">Son işlem</th><th class="sag">Güncel</th>
        <th class="sag siralanir${emirSira==='degisim'?' aktif':''}" data-eylem="emirSirala" data-v="degisim"
          title="Sıralamak için tıkla">Değişim<i>${emirSira==='degisim'?'↓':''}</i></th>
        <th class="sag">Alış hedefi</th><th class="sag">Satış hedefi</th>
        <th>Kural</th><th></th></tr>
      ${(emirSira === 'sembol' ? liste.slice().sort((a,b) => a.sembol.localeCompare(b.sembol,'tr'))
         : emirSira === 'degisim' ? liste.slice().sort((a,b) => say(b.degisim) - say(a.degisim))
         : liste).map(d => `<tr${d.hazir?'':' style="opacity:.55"'}>
        <td><b>${kacir(d.sembol)}</b>
          ${d.adet>0?`<br><small class="etk">${say(d.adet).toLocaleString('tr-TR',{maximumFractionDigits:4})} adet</small>`
            :'<br><small class="etk">pozisyon kapalı</small>'}</td>
        <td class="sag sayi">${d.referans?para(d.referans,'TRY',d.tur==='fon'?4:2):'<span class="etk">—</span>'}
          ${d.referansTarih?`<div class="etk" style="font-size:11.5px">${trTarih(d.referansTarih)}</div>`:''}</td>
        <td class="sag sayi">${d.guncel>0?para(d.guncel,'TRY',d.tur==='fon'?4:2)
          :'<span class="rozet s">fiyat yok</span>'}</td>
        <td class="sag sayi ${d.hazir?(d.degisim<0?'eks':'art'):''}">${d.hazir
          ?(d.degisim>0?'+':'')+yzd(d.degisim):'—'}</td>
        <td class="sag sayi">${d.alisHedef?`${para(d.alisHedef,'TRY',d.tur==='fon'?4:2)}
          <div class="${d.alisTetik?'art':'etk'}" style="font-size:11.5px;font-weight:500">${
            d.alisTetik?'tetiklendi':'%'+Math.abs(say(d.alisUzaklik)*100).toFixed(1).replace('.',',')+' kaldı'}</div>`
          :'<span class="etk">—</span>'}</td>
        <td class="sag sayi">${d.satisHedef?`${para(d.satisHedef,'TRY',d.tur==='fon'?4:2)}
          <div class="${d.satisTetik?'art':'etk'}" style="font-size:11.5px;font-weight:500">${
            d.satisTetikFiyat?(d.satisAdet>0?'tetiklendi':'pozisyon yok')
            :'%'+Math.abs(say(d.satisUzaklik)*100).toFixed(1).replace('.',',')+' kaldı'}</div>`
          :'<span class="etk">—</span>'}</td>
        <td>${d.kural.ozel?'<span class="rozet">kendi kuralı</span>':'<span class="etk">genel</span>'}</td>
        <td class="sag"><button class="btn ikincil ince" data-eylem="kuralDuzenle"
          data-sembol="${kacir(d.sembol)}">Kural</button></td>
      </tr>`).join('')}
    </table></div>` : bosKutu('İzlenecek sembol yok. Önce Yatırımlar sayfasından işlem ekle.')}
  </div>
  <p class="etk" style="margin-top:12px">Değişim ve hedefler, o sembolde yaptığın son alım ya da satımın
  fiyatına göre hesaplanır. Alış sütununda fiyatı son işleminin altına inmiş semboller, satış sütununda
  üstüne çıkmış olanlar yer alır; eşiğe ulaşanlar dolgulu gösterilir. Adet, tutarın güncel fiyata
  bölünüp yukarı yuvarlanmasıyla bulunur.</p>`;
}

function gorunumVarlik(){
  const v = D.varliklar||[];

  return `

    <p class="buyuk sayi">${para(toplam)}</p></div>
  <div class="kart">
    ${v.length ? `<table>

}

function gorunumHesaplar(){
  const TURAD = {vadesiz:'Vadesiz', nakit:'Nakit', kmh:'KMH', e_cuzdan:'E-cüzdan',
    yatirim:'Yatırım hesabı', vadeli:'Vadeli'};
  const SIRA = ['vadesiz','nakit','e_cuzdan','vadeli','yatirim','kmh'];
  const hepsi = (D.hesaplar||[]).filter(h => h.tur !== 'kredi_karti');
  const aktif = hepsi.filter(h => !bool(h.arsiv));
  const arsiv = hepsi.filter(h => bool(h.arsiv));

  const toplamTL = aktif.reduce((a,h) => a + tl(bakiye(h.id), h.paraBirimi), 0);
  const kartBorcu = (D.hesaplar||[]).filter(h => h.tur === 'kredi_karti' && !bool(h.arsiv))
    .reduce((a,h) => a + kartBorc(h.id) + kalanTaksitYuku(h.id), 0);

  const grup = {};
  aktif.forEach(h => (grup[h.tur] = grup[h.tur] || []).push(h));
  const turler = SIRA.filter(t => grup[t]).concat(Object.keys(grup).filter(t => !SIRA.includes(t)));

  const satir = h => {
    const b = bakiye(h.id);
    const tlKarsilik = tl(b, h.paraBirimi);
    return `<div class="oge" data-eylem="hesapDuzenle" data-id="${h.id}" style="cursor:pointer">
      <div class="hicon">${kacir((h.ad||'?').trim().charAt(0).toLocaleUpperCase('tr'))}</div>
      <div class="t"><b>${kacir(h.ad)}</b>
        <small>${kacir(h.banka || TURAD[h.tur] || h.tur)}${
          h.netVarligaDahil === false ? ' · net varlığa dahil değil' : ''}</small></div>
      <div class="a sayi ${b < 0 ? 'eks' : ''}">${para(b, h.paraBirimi)}
        ${h.paraBirimi !== 'TRY' ? `<div class="etk" style="font-weight:400;font-size:11.5px">${para(tlKarsilik)}</div>` : ''}
      </div>
    </div>`;
  };

  return `
  <div class="ust"><h1>Hesaplar</h1>
    <button class="btn ikincil" data-eylem="transferEkle">Transfer</button>
    <button class="btn" data-eylem="hesapEkle"><svg><use href="#s-plus"/></svg>Hesap ekle</button></div>
  <div class="izgara i3" style="margin-bottom:16px">
    <div class="kart"><p class="etk">Toplam bakiye</p>
      <p class="orta sayi">${para(toplamTL)}</p><p class="etk">${aktif.length} hesap</p></div>
    <div class="kart"><p class="etk">Kart borcu</p>
      <p class="orta sayi ${kartBorcu>0?'eks':''}">${para(-kartBorcu)}</p>
      <p class="etk"><a href="#kartlar">Kartlar ›</a></p></div>
    <div class="kart"><p class="etk">Net nakit</p>
      <p class="orta sayi">${para(toplamTL - kartBorcu)}</p>
      <p class="etk">bakiye eksi kart borcu</p></div>
  </div>
  ${aktif.length ? turler.map(t => `<div class="kart" style="margin-bottom:16px">
      <div class="bas"><span>${kacir(TURAD[t] || t)}</span>
        <span class="etk sayi">${para(grup[t].reduce((a,h) => a + tl(bakiye(h.id), h.paraBirimi), 0))}</span></div>
      <div class="liste">${grup[t].map(satir).join('')}</div>
    </div>`).join('') : `<div class="kart">${bosKutu('Hesap yok. Sağ üstten ekleyebilirsin.')}</div>`}
  ${arsiv.length ? `<div class="kart">
    <div class="bas"><span>Arşiv</span></div>
    <div class="liste">${arsiv.map(satir).join('')}</div></div>` : ''}`;
}

const PARA_SEC = [{v:'TRY',a:'TRY'},{v:'USD',a:'USD'},{v:'EUR',a:'EUR'}];

function islemFormu(mevcut, onTur){
  const alanlar = [
    {ad:'tur', etiket:'Tür', tip:'secim', on: onTur || 'gider',
      secenekler:[{v:'gider',a:'Gider'},{v:'gelir',a:'Gelir'},{v:'transfer',a:'Transfer'}]},
    {ad:'tarih', etiket:'Tarih', tip:'tarih', on: ymd(bugun())},
    {ad:'tutar', etiket:'Tutar', tip:'sayi'},
    {ad:'paraBirimi', etiket:'Para birimi', tip:'secim', secenekler:PARA_SEC, on:'TRY'},
    {ad:'hesapId', etiket:'Hesap', tip:'secim', secenekler: hesapSec(), on: AYAR.sonHesap || ''},
    {ad:'hedefHesapId', etiket:'Hedef hesap', tip:'secim', secenekler: hesapSec(),
      gorunur: v => v.tur === 'transfer'},
    {ad:'kategoriId', etiket:'Kategori', tip:'secim', secenekler: kategoriSec(),
      bagli: v => kategoriSec(v.tur === 'gelir' ? 'gelir' : 'gider')(),
      gorunur: v => v.tur !== 'transfer'},
    {ad:'aciklama', etiket:'Açıklama', tip:'metin', ipucu:'Migros, kira, fatura…'},
    {ad:'etiketMetin', etiket:'Etiketler', tip:'etiket', ipucu:'tadilat, tatil',
      secenekler: () => [...new Set((D.islemler||[]).flatMap(i => i.etiketler||[]))].sort()},
    {ad:'taksitSayisi', etiket:'Taksit sayısı (kart)', tip:'sayi', gorunur: v => v.tur === 'gider'},
    {ad:'butceYansimasi', etiket:'Bütçeye yansıma', tip:'secim', on:'taksitli',
      secenekler:[{v:'tam_ay',a:'Tüm tutar alışveriş ayına'},{v:'taksitli',a:'Her ay taksit tutarı kadar'}],
      gorunur: v => v.tur === 'gider' && say(v.taksitSayisi) > 1}
  ];
  const deger = mevcut ? {...mevcut, etiketMetin:(mevcut.etiketler||[]).join(', ')} : {};
  formAc({
    baslik: mevcut ? 'İşlemi düzenle' : 'Yeni işlem',
    alanlar, deger,
    sil: mevcut ? () => { D.islemler = D.islemler.filter(x=>x.id!==mevcut.id); isaretle('islemler'); } : null,
    kaydet: v => {
      const k = v.paraBirimi === 'TRY' ? 1 : kur(v.paraBirimi);
      const kayit = {
        id: mevcut ? mevcut.id : uid(),
        tur: v.tur, tarih: v.tarih, tutar: say(v.tutar), paraBirimi: v.paraBirimi,
        kur: k, tryTutar: say(v.tutar) * k,
        hesapId: v.hesapId, hedefHesapId: v.tur==='transfer' ? v.hedefHesapId : '',
        kategoriId: v.tur==='transfer' ? '' : v.kategoriId,
        aciklama: v.aciklama,
        etiketler: (v.etiketMetin||'').split(',').map(s=>s.trim()).filter(Boolean),
        taksitSayisi: say(v.taksitSayisi) > 1 ? say(v.taksitSayisi) : '',
        butceYansimasi: say(v.taksitSayisi) > 1 ? (v.butceYansimasi || 'taksitli') : 'tam_ay',
        borcTaksitId: mevcut ? mevcut.borcTaksitId : '',
        kaynak: 'elle'
      };
      if(mevcut) D.islemler = D.islemler.map(x => x.id===kayit.id ? kayit : x);
      else (D.islemler = D.islemler||[]).push(kayit);
      if(v.hesapId){ AYAR.sonHesap = v.hesapId; yereleYaz(); }
      isaretle('islemler');
    }
  });
}

/* Ödeme planı toplu giriş: her satır "tarih tutar" */
function planFormu(borcId){
  const mevcut = (D.borcTaksitleri||[]).filter(t=>t.borcId===borcId)
    .sort((a,b)=>say(a.sira)-say(b.sira))
    .map(t=>`${t.vade}\t${t.tutar}${bool(t.odendi)?'\tödendi':''}`).join('\n');
  formAc({
    baslik:'Ödeme planı', genis:true,
    alanlar:[{ad:'plan', etiket:'Her satıra bir taksit: tarih ve tutar', tip:'metinKutu', satir:14,
      ipucu:'2026-10-14  24650\n2026-11-14  24650', on: mevcut}],
    ekAlt:`<p class="etk">Tarih 2026-10-14 ya da 14.10.2026 biçiminde olabilir. Tutarda nokta ve
      virgül serbesttir. Satır sonuna “ödendi” yazarsan o taksit ödenmiş sayılır.
      Kaydettiğinde bu borcun planı tamamen yenilenir.</p>`,
    kaydet: v => {
      const satirlar = (v.plan||'').split('\n').map(s=>s.trim()).filter(Boolean);
      const yeni = [];
      satirlar.forEach((s, ix) => {
        const tarihEs = s.match(/\d{4}-\d{1,2}-\d{1,2}|\d{1,2}[./]\d{1,2}[./]\d{4}/);
        if(!tarihEs) return;
        const tarih = tarihCoz(tarihEs[0]);
        const kalanMetin = s.slice(tarihEs.index + tarihEs[0].length);
        const tutarEs = kalanMetin.match(/-?[\d.,]+/);
        const tutar = tutarEs ? sayiCoz(tutarEs[0]) : 0;
        if(!tarih || !tutar) return;
        yeni.push({id:uid(), borcId, sira:ix+1, vade:tarih, tutar,
          odendi: /ödendi|odendi/i.test(s), odemeTarihi:''});
      });
      D.borcTaksitleri = (D.borcTaksitleri||[]).filter(t=>t.borcId!==borcId).concat(yeni);
      isaretle('borcTaksitleri');
      bildir(yeni.length + ' taksit kaydedildi.');
    }
  });
}
function tarihCoz(s){
  s = String(s).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})$/);
  if(m) return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
  return '';
}
function sayiCoz(s){
  s = String(s).replace(/\s/g,'').replace(/[^\d,.-]/g,'');
  if(s.includes(',') && s.includes('.')) s = s.replace(/\./g,'').replace(',','.');
  else if(s.includes(',')) s = s.replace(',','.');
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');
  else if((s.match(/\./g)||[]).length > 1) s = s.replace(/\./g,'');
  return say(parseFloat(s));
}

function limitFormu(katId, donemSecili){
  const donem = donemSecili || fltr.ay;
  const k = kategori(katId);
  const gelirMi = k && k.yon === 'gelir';
  const mevcut = (D.butce||[]).find(b => b.kategoriId === katId && b.donem === donem);
  formAc({
    baslik: (k ? k.ad : '') + ' · ' + ayAdi(donem),
    alanlar: [
      {ad:'limitTutari',
        etiket: gelirMi ? 'Beklenen gelir' : `Aylık limit (devir ${para(devir(katId, donem))})`,
        tip:'sayi', on: mevcut ? mevcut.limitTutari : ''},
      {ad:'ileriAylar', etiket:'Aynı tutarı sonraki 11 aya da uygula', tip:'onay'}
    ],
    kaydet: v => {
      const tutar = say(v.limitTutari);
      const kac = v.ileriAylar ? 12 : 1;
      for(let i = 0; i < kac; i++){
        const d = ayEkle(donem, i);
        D.butce = (D.butce||[]).filter(b => !(b.kategoriId === katId && b.donem === d));
        if(tutar > 0) D.butce.push({id:uid(), kategoriId:katId, donem:d, limitTutari:tutar});
      }
      isaretle('butce');
    }
  });
}

function butceDuzenleFormu(donemSecili){
  const donem = donemSecili || fltr.ay;
  const gelirMi = butceTur === 'gelir';
  const kats = anaKategoriler(gelirMi ? 'gelir' : 'gider');
  if(!kats.length) return bildir('Önce kategori ekle.');
  const alanlar = kats.map(k => ({ad:'k_' + k.id, etiket:k.ad, tip:'sayi'}));
  alanlar.push({ad:'ileriAylar',
    etiket: gelirMi ? 'Aynı planı sonraki 11 aya da uygula' : 'Aynı limitleri sonraki 11 aya da uygula',
    tip:'onay'});
  const deger = {};
  kats.forEach(k => {
    const b = (D.butce||[]).find(x => x.kategoriId === k.id && x.donem === donem);
    if(b) deger['k_' + k.id] = b.limitTutari;
  });
  formAc({
    baslik: ayAdi(donem) + (gelirMi ? ' gelir planı' : ' limitleri'), genis:true, alanlar, deger,
    kaydet: v => {
      const kac = v.ileriAylar ? 12 : 1;
      const katIdler = new Set(kats.map(k => k.id));
      for(let i = 0; i < kac; i++){
        const d = ayEkle(donem, i);
        // yalnızca bu sekmenin kategorilerine dokun
        D.butce = (D.butce||[]).filter(b => !(b.donem === d && katIdler.has(b.kategoriId)));
        kats.forEach(k => {
          const t = say(v['k_' + k.id]);
          if(t > 0) D.butce.push({id:uid(), kategoriId:k.id, donem:d, limitTutari:t});
        });
      }
      isaretle('butce');
    }
  });
}

const AY_ADLARI = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];

/* "Eylül 2026", "Eyl 2026", "2026-09", "09.2026", bozuk kodlamalı
   "Eylul 2026" gibi yazımların hepsini döneme çevirir */
function harfSadeles(t){
  return String(t||'').toLocaleLowerCase('tr')
    .replace(/[ıi̇í]/g,'i').replace(/ü/g,'u').replace(/ö/g,'o')
    .replace(/ş/g,'s').replace(/ç/g,'c').replace(/ğ/g,'g')
    .replace(/[^a-z0-9]/g,'');
}
function donemCoz(metin){
  const t = String(metin||'').trim();
  if(!t) return '';
  let m = t.match(/^(\d{4})[-/.](\d{1,2})$/);
  if(m) return m[1] + '-' + String(m[2]).padStart(2,'0');
  m = t.match(/^(\d{1,2})[-/.](\d{4})$/);
  if(m) return m[2] + '-' + String(m[1]).padStart(2,'0');
  m = t.match(/^\d{1,2}[-/.](\d{1,2})[-/.](\d{4})$/);          // 01.09.2026
  if(m) return m[2] + '-' + String(m[1]).padStart(2,'0');
  const yil = (t.match(/(20\d{2})/) || [])[1];
  if(!yil) return '';
  const sade = harfSadeles(t.replace(yil, ''));
  if(!sade) return '';
  const kisa = ['oca','sub','mar','nis','may','haz','tem','agu','eyl','eki','kas','ara'];
  const ix = kisa.findIndex(k => sade.startsWith(k) || sade.indexOf(k) === 0);
  if(ix > -1) return yil + '-' + String(ix+1).padStart(2,'0');
  const ing = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  const ix2 = ing.findIndex(k => sade.startsWith(k));
  if(ix2 > -1) return yil + '-' + String(ix2+1).padStart(2,'0');
  return '';
}
/* Excel'in Türkçe ayarında doğru okunsun diye ondalık ayracı virgül */
function csvSayi(v){
  if(v === '' || v === null || v === undefined) return '';
  const n = say(v);
  if(!isFinite(n)) return '';
  return String(n).replace('.', ',');
}
function csvHucre(v){
  const t = String(v == null ? '' : v);
  return /[";\n]/.test(t) ? '"' + t.replace(/"/g,'""') + '"' : t;
}
function csvCoz(metin){
  const satirlar = [];
  let alan = '', satir = [], tirnak = false;
  const ayirac = (metin.split('\n')[0].split(';').length > metin.split('\n')[0].split('\t').length) ? ';' : '\t';
  for(let i = 0; i < metin.length; i++){
    const c = metin[i];
    if(tirnak){
      if(c === '"' && metin[i+1] === '"'){ alan += '"'; i++; }
      else if(c === '"') tirnak = false;
      else alan += c;
    } else if(c === '"') tirnak = true;
    else if(c === ayirac){ satir.push(alan); alan = ''; }
    else if(c === '\n'){ satir.push(alan); satirlar.push(satir); satir = []; alan = ''; }
    else if(c !== '\r') alan += c;
  }
  if(alan !== '' || satir.length){ satir.push(alan); satirlar.push(satir); }
  return satirlar.filter(r => r.some(x => String(x).trim() !== ''));
}

/* Bütçeyi Excel'de açılabilen dosyaya aktarır: 12 ay, kategori bazında */
function butceDisaAktar(){
  const gelirMi = butceTur === 'gelir';
  const kats = anaKategoriler(gelirMi ? 'gelir' : 'gider');
  if(!kats.length) return bildir('Önce kategori ekle.');

  const satirlar = kats.map(k => [k.ad].concat(aylar.map(a => csvSayi(butceSatir(k.id, a)) || '0')));
  const metin = '\ufeff' + [basliklar].concat(satirlar)
    .map(r => r.map(csvHucre).join(';')).join('\r\n');

  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = 'kalan-' + (gelirMi ? 'gelir' : 'gider') + '-butce-' + fltr.ay + '.csv';
  a.click();

}

/* Aynı biçimdeki dosyayı geri okur ve limitleri günceller */
function butceIceAktar(){
  const g = document.createElement('input');
  g.type = 'file';
  g.accept = '.csv,.txt,text/csv,application/vnd.ms-excel';
  g.onchange = () => {
    const f = g.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const bayt = new Uint8Array(r.result);
        // .xlsx ve .xls dosyaları metin değildir
        if(bayt[0] === 0x50 && bayt[1] === 0x4B)
          return bildir('Bu bir Excel çalışma kitabı (.xlsx). Excel’de Farklı Kaydet > CSV UTF-8 seçip öyle kaydet.');
        if(bayt[0] === 0xD0 && bayt[1] === 0xCF)
          return bildir('Bu eski bir Excel dosyası (.xls). Farklı Kaydet > CSV UTF-8 seçip öyle kaydet.');
        let metin = new TextDecoder('utf-8').decode(bayt);
        if(metin.indexOf('\uFFFD') > -1){            // Türkçe karakterler bozuksa
          try{ metin = new TextDecoder('windows-1254').decode(bayt); }catch(e){}
        }
        butceMetindenAktar(metin.replace(/^\ufeff/, ''));
      }catch(e){ bildir('Dosya okunamadı: ' + e.message); }
    };
    r.readAsArrayBuffer(f);
  };
  g.click();
}

function butceMetindenAktar(metin){
  const satirlar = csvCoz(metin);
  if(satirlar.length < 2) return bildir('Dosyada satır bulunamadı.');
  const bas = satirlar[0];
  let aylar = bas.slice(1).map(donemCoz);
  if(!aylar.some(Boolean)){
    const sutun = bas.length - 1;
    const onay = confirm('Başlık satırındaki aylar okunamadı.\n\n' +
      'Sütunlar ' + ayAdi(fltr.ay) + ' ayından başlayarak sırayla eşleştirilsin mi?');
    if(!onay) return;
    aylar = Array.from({length: sutun}, (_, i) => ayEkle(fltr.ay, i));
  }
  let yazilan = 0, bilinmeyen = [];
  satirlar.slice(1).forEach(satir => {
    const ad = String(satir[0]||'').trim();
    if(!ad || harfSadeles(ad) === 'toplam' || harfSadeles(ad) === 'kategori'
       || harfSadeles(ad) === 'gelirkalemi') return;
    const yon = butceTur === 'gelir' ? 'gelir' : 'gider';
    let k = anaKategoriler(yon).find(x => harfSadeles(x.ad) === harfSadeles(ad));
    if(!k){
      k = {id:uid(), parentId:'', ad, yon, arsiv:false};
      (D.kategoriler = D.kategoriler||[]).push(k);
      bilinmeyen.push(ad);
    }
    aylar.forEach((donem, i) => {
      if(!donem) return;
      const hucre = satir[i+1];
      if(hucre === undefined) return;
      const tutar = sayiCoz(hucre);
      D.butce = (D.butce||[]).filter(b => !(b.kategoriId === k.id && b.donem === donem));
      if(tutar > 0){ D.butce.push({id:uid(), kategoriId:k.id, donem, limitTutari:tutar}); yazilan++; }
    });
  });
  if(bilinmeyen.length) isaretle('kategoriler');
  isaretle('butce');
  ciz();
  bildir(yazilan + ' limit güncellendi' +
    (bilinmeyen.length ? ' · yeni kategori: ' + bilinmeyen.join(', ') : '') + '.');
}

function tradeMetindenAktar(metin){
  const satirlar = csvCoz(metin);
  if(satirlar.length < 2) return bildir('Dosyada satır bulunamadı.');

  // Başlıkları esnek eşleştir
  const bas = satirlar[0].map(harfSadeles);
  const bul = (...adaylar) => {
    for(const a of adaylar){
      const i = bas.indexOf(harfSadeles(a));
      if(i > -1) return i;
    }
    return -1;
  };
  const K = {
    tarih:  bul('Tarih','Date'),
    sembol: bul('Sembol','Hisse','Kod','Symbol'),
    ad:     bul('Ad','Adı','Unvan','İsim'),
    tur:    bul('Tür','Tur','Type'),
    yon:    bul('İşlem','Islem','Yön','Yon','Alış/Satış'),
    adet:   bul('Adet','Lot','Miktar'),
    fiyat:  bul('Fiyat','Birim fiyat','Tutar'),
    tutar:  bul('Tutar','Net tutar','Net'),
    stopaj: bul('Stopaj'),
    oran:   bul('Oran'),
    kur:    bul('USD kuru','Kur','USD'),
    not:    bul('Not','Açıklama')
  };
  if(K.tarih < 0 || K.sembol < 0)
    return bildir('Başlık satırında Tarih ve Sembol kolonları bulunamadı. Dışa aktardığın dosyanın biçimini koru.');

  const yonCoz = v => {
    const t = harfSadeles(v);
    if(!t) return '';
    if(t.startsWith('al')) return 'alis';
    if(t.startsWith('sat')) return 'satis';
    if(t.startsWith('tem') || t.startsWith('div')) return 'temettu';
    if(t.startsWith('bed')) return 'bedelsiz';
    if(t.startsWith('bol')) return 'bolunme';
    return '';
  };
  const turCoz = v => harfSadeles(v).startsWith('fon') ? 'fon' : 'hisse';
  const al = (satir, i) => i > -1 ? String(satir[i] ?? '').trim() : '';

  const yeni = [];
  const hatalar = [];
  satirlar.slice(1).forEach((satir, ix) => {
    if(!satir.some(x => String(x).trim())) return;
    const sembol = al(satir, K.sembol).toUpperCase();
    const tarih = tarihCoz(al(satir, K.tarih));
    const yon = yonCoz(al(satir, K.yon)) || 'alis';
    if(!sembol || !tarih){ hatalar.push(ix + 2); return; }
    const adet = say(sayiCoz(al(satir, K.adet)));
    const fiyat = say(sayiCoz(al(satir, K.fiyat)));
    const tutar = say(sayiCoz(al(satir, K.tutar)));
    const stopaj = say(sayiCoz(al(satir, K.stopaj)));
    const oran = say(sayiCoz(al(satir, K.oran)));
    // Temettüde net tutar: önce Tutar kolonu, yoksa Fiyat; eski dosyalarda stopaj düşülür
    const temettuNet = (tutar > 0 ? tutar : fiyat) - (tutar > 0 ? 0 : stopaj);
    if((yon === 'alis' || yon === 'satis') && !(adet > 0 && fiyat > 0)){ hatalar.push(ix + 2); return; }
    if(yon === 'temettu' && !(temettuNet > 0)){ hatalar.push(ix + 2); return; }
    if((yon === 'bedelsiz' || yon === 'bolunme') && !(oran > 0)){ hatalar.push(ix + 2); return; }
    yeni.push({
      id: uid(), tarih, sembol, ad: al(satir, K.ad),
      tur: turCoz(al(satir, K.tur)), yon,
      adet: (yon === 'alis' || yon === 'satis') ? adet : '',
      fiyat: yon === 'temettu' ? temettuNet
           : ((yon === 'bedelsiz' || yon === 'bolunme') ? '' : fiyat),
      stopaj: '',
      oran: (yon === 'bedelsiz' || yon === 'bolunme') ? oran : '',
      usdKuru: say(sayiCoz(al(satir, K.kur))),
      not: al(satir, K.not)
    });
  });

  if(!yeni.length)
    return bildir('Okunabilir satır bulunamadı' + (hatalar.length ? ' (' + hatalar.length + ' satır atlandı)' : '') + '.');

  const mevcutSayi = (D.trades||[]).length;
  const soru = mevcutSayi
    ? yeni.length + ' işlem okundu.\n\nTamam: mevcut ' + mevcutSayi +
      ' işlemin üzerine yazılsın (dosya artık tek kaynak).\nİptal: mevcutların sonuna eklensin.'
    : yeni.length + ' işlem okundu, kaydedilsin mi?';
  const uzerineYaz = mevcutSayi ? confirm(soru) : confirm(soru);
  if(mevcutSayi && !uzerineYaz) D.trades = (D.trades||[]).concat(yeni);
  else D.trades = yeni;

  isaretle('trades');
  ciz();
  const kursuz = yeni.filter(t => !(say(t.usdKuru) > 0)).length;
  bildir(yeni.length + ' işlem yüklendi' +
    (hatalar.length ? ' · ' + hatalar.length + ' satır atlandı' : '') +
    (kursuz ? ' · ' + kursuz + ' satırda kur boş' : '') + '.');
  if(kursuz) tradeKurlariTamamla();
}

/* Kuru boş olan işlemler için o günün kurunu tek tek çeker */
async function tradeKurlariTamamla(){
  const eksik = (D.trades||[]).filter(t => !(say(t.usdKuru) > 0) && t.tarih);
  if(!eksik.length) return;
  const tarihler = [...new Set(eksik.map(t => t.tarih))];
  durumYaz('Kurlar alınıyor…');
  let bulunan = 0;
  for(const tarih of tarihler){
    const k = await gunlukKur(tarih);
    if(k > 0){
      D.trades = D.trades.map(t => (t.tarih === tarih && !(say(t.usdKuru) > 0)) ? {...t, usdKuru:k} : t);
      bulunan++;
    }
  }
  isaretle('trades'); ciz();
  bildir(bulunan + ' tarih için kur bulundu' +
    (bulunan < tarihler.length ? ', ' + (tarihler.length - bulunan) + ' tarih boş kaldı' : '') + '.');
}

function butceKopyala(){
  const onceki = ayEkle(fltr.ay, -1);
  const katIdler = new Set(anaKategoriler(butceTur === 'gelir' ? 'gelir' : 'gider').map(k => k.id));
  const kaynak = (D.butce||[]).filter(b => b.donem === onceki && katIdler.has(b.kategoriId));
  if(!kaynak.length) return bildir('Geçen ay için kayıt yok.');
  D.butce = (D.butce||[]).filter(b => !(b.donem === fltr.ay && katIdler.has(b.kategoriId)))
    .concat(kaynak.map(b => ({...b, id:uid(), donem: fltr.ay})));
  isaretle('butce'); ciz(); bildir(kaynak.length + ' kayıt kopyalandı.');
}

function kuralFormu(sembol){
  const genelMi = !sembol || sembol === '*';
  const s = genelMi ? '*' : String(sembol).toUpperCase();
  const mevcut = (D.emirKurallari||[]).find(k =>
    genelMi ? (!k.sembol || k.sembol === '*') : String(k.sembol||'').toUpperCase() === s);
  const g = genelKural();
  const semboller = [...new Set((D.trades||[]).map(t => String(t.sembol||'').toUpperCase()))]
    .filter(Boolean).sort();

  const ipucu = a => genelMi ? '' : (say(g[a]) > 0
    ? 'genel: ' + (a.indexOf('Tutar') > -1 ? para(g[a]) : '%' + (say(g[a])*100).toFixed(1).replace('.',','))
    : 'genel kural yok');

  const alanlar = [];
  if(!genelMi) alanlar.push({ad:'sembol', etiket:'Sembol', tip:'secim',
    secenekler: () => semboller.map(x => ({v:x, a:x})), on: s === '*' ? (semboller[0]||'') : s});
  alanlar.push(
    {ad:'alisTutar', etiket:'Alış tutarı (TL)', tip:'sayi', ipucu: ipucu('alisTutar')},
    {ad:'alisYuzde', etiket:'Alış için istenen düşüş (%)', tip:'sayi',
      ipucu: genelMi ? 'örn. 10' : (say(g.alisDusus)>0 ? 'genel: %'+(say(g.alisDusus)*100).toFixed(1).replace('.',',') : 'örn. 10')},
    {ad:'satisTutar', etiket:'Satış tutarı (TL)', tip:'sayi', ipucu: ipucu('satisTutar')},
    {ad:'satisYuzde', etiket:'Satış için istenen artış (%)', tip:'sayi',
      ipucu: genelMi ? 'örn. 10' : (say(g.satisArtis)>0 ? 'genel: %'+(say(g.satisArtis)*100).toFixed(1).replace('.',',') : 'örn. 10')}
  );

  const deger = {};
  if(mevcut){
    deger.sembol = mevcut.sembol;
    if(mevcut.alisTutar !== '' && mevcut.alisTutar != null) deger.alisTutar = mevcut.alisTutar;
    if(mevcut.satisTutar !== '' && mevcut.satisTutar != null) deger.satisTutar = mevcut.satisTutar;
    if(mevcut.alisDusus !== '' && mevcut.alisDusus != null) deger.alisYuzde = +(say(mevcut.alisDusus)*100).toFixed(4);
    if(mevcut.satisArtis !== '' && mevcut.satisArtis != null) deger.satisYuzde = +(say(mevcut.satisArtis)*100).toFixed(4);
  }

  formAc({
    baslik: genelMi ? 'Genel emir kuralı' : (mevcut ? s + ' kuralı' : 'Hisse kuralı'),
    alanlar, deger,
    ekAlt: `<p class="etk" style="margin-top:-4px">${genelMi
      ? 'Bu kural, kendi kuralı olmayan tüm sembollere uygulanır. Yüzdeleri 10 gibi tam sayı olarak yaz.'
      : 'Boş bıraktığın alanlarda genel kural geçerli olur. Yüzdeleri 10 gibi tam sayı olarak yaz.'}</p>`,
    sil: mevcut ? () => {
      D.emirKurallari = (D.emirKurallari||[]).filter(k => k.id !== mevcut.id);
      isaretle('emirKurallari');
    } : null,
    kaydet: v => {
      const bos = x => v[x] === '' || v[x] === undefined || v[x] === null || say(v[x]) === 0;
      const kayit = {
        id: mevcut ? mevcut.id : uid(),
        sembol: genelMi ? '*' : String(v.sembol||'').toUpperCase(),
        alisTutar: bos('alisTutar') ? '' : say(v.alisTutar),
        alisDusus: bos('alisYuzde') ? '' : say(v.alisYuzde) / 100,
        satisTutar: bos('satisTutar') ? '' : say(v.satisTutar),
        satisArtis: bos('satisYuzde') ? '' : say(v.satisYuzde) / 100
      };
      D.emirKurallari = (D.emirKurallari||[]).filter(k => k.id !== kayit.id
        && !(genelMi && (!k.sembol || k.sembol === '*'))
        && !(!genelMi && String(k.sembol||'').toUpperCase() === kayit.sembol));
      D.emirKurallari.push(kayit);
      isaretle('emirKurallari');
    }
  });
}

function ciz(){
  const g = GORUNUMLER[aktifSayfa] || gorunumOzet;
  const serit = (AYAR.mod === 'supabase' && !OTURUM)
    ? `<div class="serit">
         <span>Giriş yapılmadı — veriler yüklenmedi.</span>
         <button class="btn" data-eylem="sbGirisAc">Giriş yap</button>
       </div>` : '';
  // Arama kutusu gibi alanlar her çizimde yeniden oluşur; imleç kaybolmasın
  const o = document.activeElement;
  const odak = (o && o.dataset && o.dataset.odak)
    ? {ad: o.dataset.odak, bas: o.selectionStart, son: o.selectionEnd} : null;

  /* Sayfa başına yalnızca gerçekten başka bir sayfaya geçerken dönülür.
     Otomatik eşitleme ve fiyat güncellemesi de ciz() çağırıyor; bunlarda
     kaydırma yerinde kalmalı, yoksa liste okurken sayfa sürekli başa atar. */
  const anahtar = aktifSayfa + '|' + yatSayfa;
  const ayniYer = cizilenAnahtar === anahtar;
  const kaydirma = window.scrollY;

  $('#ana').innerHTML = serit + g();
  cizilenAnahtar = anahtar;
  if(typeof dugmeYaz === 'function') dugmeYaz();
  if(AYAR.saltOkunur){
    $$('#ana [data-eylem]').forEach(d => {
      if(SERBEST_EYLEM.has(d.dataset.eylem) && d.dataset.eylem !== 'zorlaKaydet') return;
      if(d.tagName === 'BUTTON') d.style.display = 'none';
      else d.removeAttribute('data-eylem');
    });
  }
  $$('.yan .sek').forEach(a => a.classList.toggle('on', a.dataset.git === aktifSayfa));
  if(odak){
    const y = $(`[data-odak="${odak.ad}"]`);
    if(y){
      y.focus();
      try{ y.setSelectionRange(odak.bas, odak.son); }catch(e){}
      return;                              // yazarken sayfa başa sarmasın
    }
  }
  if(ayniYer) window.scrollTo(0, kaydirma);
  else window.scrollTo(0, 0);
}

      const dene = async (ad, secenekler) => {
        try{
          const c = await fetch(adres + '?action=ping', secenekler);
          const metin = (await c.text()).slice(0, 300);
          satir.push(ad + ': HTTP ' + c.status + ' — ' + (metin || '(boş)'));

        }catch(e){

      const a = OTURUM

      const b = await dene('Başlıksız istek', undefined);

        satir.push('\nFonksiyon bulunamadı. Edge Functions listesinde adı tam olarak "fiyat" olmalı.');

        satir.push('\nHiçbir istek ulaşmadı. İki olası sebep:');

      const eksikD = sem.doviz.filter(x => x !== 'TRY' && !(fiyatBul(x) > 0));

      // İnceleme de gruplara bölünür: tek büyük istek zaman aşımına uğrar

          try{

            Object.assign(t, (j && j.tani) || {});

              gelenler.push(kod);

            Object.values(isler[i]).forEach(v => String(v).split(',').forEach(
              x => { if(x) t[x] = ['istek başarısız: ' + e.message]; }));
          }
        }
        if(gelenler.length){ isaretle('fiyatlar'); ciz(); }
        const satir = ['Eksik fiyatlar incelendi — her sembol için denenen kaynaklar:', ''];
        Object.keys(t).sort().forEach(k => satir.push(k + ': ' + (t[k]||[]).join('  →  ')));
        if(gelenler.length) satir.push('', 'Bu denemede gelenler: ' + gelenler.join(', '));
        if(hatalar.length) satir.push('', 'Başarısız istek: ' + [...new Set(hatalar)].join(' · '));
        durumYaz('İnceleme bitti', 'ok');
        alert(satir.join('\n'));
      }catch(e){
        durumYaz('İncelenemedi', 'hata');

      }

(function baslat(){
  const vardi = yereldenOku();

  TABLOLAR.forEach(t => { if(!D[t]) D[t] = []; });

    AYAR.sbUrl = VARSAYILAN_SB_URL; AYAR.sbKey = VARSAYILAN_SB_KEY;
  }
  if(sbHazir()) { AYAR.mod = 'supabase'; AYAR.saltOkunur = false; yereleYaz(); }
  if(SUNUCU_ICI) AYAR.mod = 'sunucu';
  if(!AYAR.tablo && VARSAYILAN_TABLO) AYAR.tablo = VARSAYILAN_TABLO;
  // Bir adres üzerinden sunuluyorsa yazma engeli yoktur: tam düzenleme
  if(AYAR.mod !== 'supabase' && !SUNUCU_ICI && !YEREL_DOSYA && VARSAYILAN_URL && AYAR.mod !== 'dosya'){
    AYAR.mod = 'sheets'; AYAR.url = VARSAYILAN_URL; AYAR.saltOkunur = false;
  }
  // Dosya olarak açıldıysa yalnızca okuma yapılabilir
  if(AYAR.mod !== 'supabase' && !SUNUCU_ICI && YEREL_DOSYA && AYAR.mod !== 'dosya'){
    AYAR.mod = 'tablo'; AYAR.saltOkunur = true;
  }
  if(!SUNUCU_ICI && VARSAYILAN_URL && AYAR.mod !== 'dosya' && (!AYAR.url || adresSorunu(AYAR.url))){
    AYAR.url = VARSAYILAN_URL; yereleYaz();
  }
  if(AYAR.mod === 'supabase'){
    if(kurtarmaKontrol()){ /* yeni parola ekranı açıldı */ }
    else if(OTURUM) sbYukle({sessiz:true});
    else girisEkrani();
  }
  else if(SUNUCU_ICI) verileriYukle({sessiz:true});
  else if(AYAR.mod === 'sheets') verileriYukle({sessiz:true});
  else if(AYAR.mod === 'tablo') tablodanYukle({sessiz:true});
  else if(AYAR.mod === 'dosya'){
    durumYaz('Dosya bekliyor — tıkla', 'hata');
    dosyayiBagla({sessiz:true});
  }
  else if(AYAR.url) verileriYukle({sessiz:true});
  else durumYaz('Yalnızca bu cihazda');
})();
</script>
